  {id:"d23", cat:"sal", ar:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ", tr:"Allâhumma a'innî 'alâ dhikrika wa shukrika wa husni 'ibâdatik.", fr:"Ô Allah, aide-moi à T'évoquer, à Te remercier et à T'adorer de la meilleure façon.", src:"Abû Dâwûd, An-Nasâ'î · à la fin de chaque prière"},
  {id:"d24", cat:"sal", ar:"أَسْتَغْفِرُ اللَّهَ (ثَلَاثًا)، اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", tr:"Astaghfiru-llâh (3 fois). Allâhumma anta-s-salâm wa minka-s-salâm, tabârakta yâ dha-l-jalâli wa-l-ikrâm.", fr:"Je demande pardon à Allah (3 fois). Ô Allah, Tu es la Paix et de Toi vient la paix ; béni sois-Tu, ô Détenteur de la majesté et de la générosité.", src:"Muslim · juste après le salâm"},
  {id:"d25", cat:"sal", ar:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", tr:"Allâhumma-ftah lî abwâba rahmatik.", fr:"Ô Allah, ouvre-moi les portes de Ta miséricorde.", src:"Muslim · en entrant à la mosquée"},
  {id:"d26", cat:"sal", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", tr:"Allâhumma innî as'aluka min fadlik.", fr:"Ô Allah, je Te demande de Ta grâce.", src:"Muslim · en sortant de la mosquée"},
  {id:"d27", cat:"mat", ar:"اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَئُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ", tr:"Allâhu lâ ilâha illâ huwa-l-Hayyu-l-Qayyûm, lâ ta'khudhuhu sinatun wa lâ nawm, lahu mâ fi-s-samâwâti wa mâ fi-l-ard, man dha-lladhî yashfa'u 'indahu illâ bi-idhnih, ya'lamu mâ bayna aydîhim wa mâ khalfahum, wa lâ yuhîtûna bi-shay'in min 'ilmihi illâ bimâ shâ', wasi'a kursiyyuhu-s-samâwâti wa-l-ard, wa lâ ya'ûduhu hifzuhumâ, wa huwa-l-'Aliyyu-l-'Azîm.", fr:"Allah ! Pas de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même. Ni somnolence ni sommeil ne Le saisissent. À Lui ce qui est dans les cieux et sur la terre. Qui peut intercéder auprès de Lui sans Sa permission ? Il connaît ce qui est devant eux et derrière eux, et ils n'embrassent de Sa science que ce qu'Il veut. Son Trône déborde les cieux et la terre, dont la garde ne Lui coûte aucune peine. Et Il est le Très-Haut, l'Immense.", src:"Coran 2:255 · Âyat al-Kursî, après chaque prière et avant de dormir"},
  {id:"d28", cat:"mat", ar:"بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", tr:"Bismi-llâhi-lladhî lâ yadurru ma'a-smihi shay'un fi-l-ardi wa lâ fi-s-samâ'i wa huwa-s-Samî'u-l-'Alîm.", fr:"Au nom d'Allah, avec le nom de qui rien ne peut nuire sur terre ni dans le ciel, et Il est Celui qui entend tout et sait tout.", src:"Abû Dâwûd, At-Tirmidhî · 3 fois matin et soir"},
  {id:"d29", cat:"mat", ar:"رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا", tr:"Radîtu billâhi Rabbâ, wa bi-l-islâmi dînâ, wa bi-Muhammadin ﷺ nabiyyâ.", fr:"Je suis satisfait d'Allah comme Seigneur, de l'islam comme religion et de Muhammad ﷺ comme prophète.", src:"Abû Dâwûd · 3 fois matin et soir"},
  {id:"d30", cat:"mat", ar:"حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", tr:"Hasbiya-llâhu lâ ilâha illâ huwa, 'alayhi tawakkaltu wa huwa Rabbu-l-'arshi-l-'azîm.", fr:"Allah me suffit, nulle divinité à part Lui ; en Lui je place ma confiance, et Il est le Seigneur du Trône immense.", src:"Coran 9:129 · 7 fois matin et soir (Abû Dâwûd)"},
  {id:"d31", cat:"mat", ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", tr:"Subhâna-llâhi wa bi-hamdih.", fr:"Gloire et louange à Allah.", src:"Al-Bukhârî, Muslim · 100 fois par jour"},
  {id:"d32", cat:"mat", ar:"لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", tr:"Lâ ilâha illa-llâhu wahdahu lâ sharîka lah, lahu-l-mulku wa lahu-l-hamd, wa huwa 'alâ kulli shay'in qadîr.", fr:"Nulle divinité excepté Allah, Seul, sans associé. À Lui la royauté et la louange, et Il est capable de toute chose.", src:"Al-Bukhârî, Muslim · 100 fois par jour"},
  {id:"d33", cat:"mat", ar:"أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ، رَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ", tr:"Asbahnâ wa asbaha-l-mulku lillâh, wa-l-hamdu lillâh, lâ ilâha illa-llâhu wahdahu lâ sharîka lah, lahu-l-mulku wa lahu-l-hamdu wa huwa 'alâ kulli shay'in qadîr. Rabbi as'aluka khayra mâ fî hâdha-l-yawmi wa khayra mâ ba'dah, wa a'ûdhu bika min sharri mâ fî hâdha-l-yawmi wa sharri mâ ba'dah. Rabbi a'ûdhu bika mina-l-kasali wa sû'i-l-kibar, Rabbi a'ûdhu bika min 'adhâbin fi-n-nâri wa 'adhâbin fi-l-qabr.", fr:"Nous voici au matin et la royauté appartient à Allah. Louange à Allah ; nulle divinité excepté Allah, Seul, sans associé ; à Lui la royauté et la louange, et Il est capable de toute chose. Seigneur, je Te demande le bien de ce jour et de ce qui le suit, et je cherche refuge auprès de Toi contre le mal de ce jour et de ce qui le suit. Seigneur, je cherche refuge auprès de Toi contre la paresse et les maux de la vieillesse, contre un châtiment dans le Feu et un châtiment dans la tombe.", src:"Muslim · le soir : « amsaynâ wa amsâ… » et « cette nuit »"},
  {id:"d34", cat:"mat", ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ", tr:"Allâhumma innî as'aluka-l-'âfiyata fi-d-dunyâ wa-l-âkhirah.", fr:"Ô Allah, je Te demande la préservation dans ce monde et dans l'au-delà.", src:"Abû Dâwûd, Ibn Mâjah"},

  {id:"d36", cat:"pard", ar:"رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ", tr:"Rabbanâ lâ tuzigh qulûbanâ ba'da idh hadaytanâ wa hab lanâ min ladunka rahmah, innaka anta-l-Wahhâb.", fr:"Seigneur, ne laisse pas dévier nos cœurs après nous avoir guidés, et accorde-nous Ta miséricorde : c'est Toi le Grand Donateur.", src:"Coran 3:8"},
  {id:"d37", cat:"nuit", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", tr:"Al-hamdu lillâhi-lladhî ahyânâ ba'da mâ amâtanâ wa ilayhi-n-nushûr.", fr:"Louange à Allah qui nous a redonné la vie après nous avoir fait mourir, et c'est vers Lui la résurrection.", src:"Al-Bukhârî · au réveil"},
  {id:"d38", cat:"nuit", ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", tr:"Bismika-llâhumma amûtu wa ahyâ.", fr:"C'est en Ton nom, ô Allah, que je meurs et que je vis.", src:"Al-Bukhârî · avant de dormir"},
  {id:"d39", cat:"rep", ar:"بِسْمِ اللَّهِ — وَإِنْ نَسِيَ: بِسْمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ", tr:"Bismillâh. Si tu as oublié au début : Bismillâhi awwalahu wa âkhirah.", fr:"Au nom d'Allah. (Si oublié : au nom d'Allah, au début et à la fin.)", src:"Abû Dâwûd, At-Tirmidhî · avant ton repas OMAD"},
  {id:"d40", cat:"rep", ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", tr:"Al-hamdu lillâhi-lladhî at'amanî hâdhâ wa razaqanîhi min ghayri hawlin minnî wa lâ quwwah.", fr:"Louange à Allah qui m'a nourri de ceci et me l'a accordé sans force ni puissance de ma part.", src:"Abû Dâwûd, At-Tirmidhî · après le repas"},
  {id:"d41", cat:"rep", ar:"ذَهَبَ الظَّمَأُ وَابْتَلَّتِ الْعُرُوقُ وَثَبَتَ الْأَجْرُ إِنْ شَاءَ اللَّهُ", tr:"Dhahaba-z-zama'u wa-btallati-l-'urûqu wa thabata-l-ajru in shâ' Allâh.", fr:"La soif est partie, les veines sont humectées, et la récompense est acquise, si Allah le veut.", src:"Abû Dâwûd · à la rupture du jeûne"},

  {id:"d43", cat:"biz", ar:"رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", tr:"Rabbanâ taqabbal minnâ innaka anta-s-Samî'u-l-'Alîm.", fr:"Seigneur, accepte ceci de notre part, car c'est Toi l'Audient, l'Omniscient.", src:"Coran 2:127 · après une journée de travail"},

function niceStep(raw){ if (raw <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function roundTop(x, y, w, h, r){ r = Math.max(0, Math.min(r, h, w / 2)); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
let CHARTS = [];
function barChart(o){ CHARTS.push({kind:"bar", o}); return `<div class="chart" data-chart="${CHARTS.length - 1}" style="height:${o.h || 170}px"></div>`; }
function lineChart(o){
  if (!o.values.some(v => v != null) && !o.plan) return `<div class="empty">Pas encore de données.</div>`;
  CHARTS.push({kind:"line", o}); return `<div class="chart" data-chart="${CHARTS.length - 1}" style="height:${o.h || 190}px"></div>`;
}
function drawCharts(root = document){
  root.querySelectorAll("[data-chart]").forEach(el => {
    const c = CHARTS[+el.dataset.chart]; if (!c) return;
    const W = Math.max(260, Math.round(el.clientWidth || 600));
    el.innerHTML = c.kind === "bar" ? barSVG(c.o, W) : lineSVG(c.o, W);
  });
}
function barSVG({labels, series, h = 170, yfmt = v => nf(v), tips, ref}, W){
  const L = 34, R = 6, Tp = 12, Bm = 22, pw = W - L - R, ph = h - Tp - Bm;
  const max = Math.max(3, ...series.flatMap(s => s.values.map(v => v || 0)), ref ? ref.v : 0);
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step, y = v => Tp + ph - v / top * ph;
  let g = "", bars = "", hits = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 7}" y="${y(v) + 3}" text-anchor="end">${esc(yfmt(v))}</text>`;
  const n = labels.length, gw = pw / n, ns = series.length, bw = Math.min(22, Math.max(4, (gw - 6) / ns - 2)), every = Math.max(1, Math.ceil(n / Math.max(4, Math.floor(pw / 52))));
  labels.forEach((lab, i) => {
    const gx = L + i * gw, tw = ns * bw + (ns - 1) * 2, x0 = gx + (gw - tw) / 2;
    series.forEach((s, j) => { const v = s.values[i] || 0; if (v > 0){ const yy = y(v); bars += `<path class="bk" style="--j:${i}" fill="${s.color}" d="${roundTop(x0 + j * (bw + 2), yy, bw, Tp + ph - yy, 4)}"/>`; } });
    if (i % every === 0 || i === n - 1) g += `<text class="ax" x="${gx + gw / 2}" y="${h - 6}" text-anchor="middle">${esc(lab)}</text>`;
    hits += `<rect class="hit" x="${gx}" y="${Tp}" width="${gw}" height="${ph}" data-tip="${esc(tips ? tips(i) : lab)}"/><rect class="hv" x="${gx + 1}" y="${Tp}" width="${Math.max(1, gw - 2)}" height="${ph}" rx="6"/>`;
  });
  if (ref) g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref.v)}" y2="${y(ref.v)}"/><text class="reft" x="${W - R}" y="${y(ref.v) - 5}" text-anchor="end">${esc(ref.l)}</text>`;
  return `<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="Graphique">${g}${bars}${hits}</svg>`;
}
function lineSVG({labels, values, h = 190, color = "var(--acc)", yfmt = v => nf1(v), tips, ref, plan}, W){
  const pts = values.map((v, i) => v == null ? null : [i, v]).filter(Boolean);
  const L = 38, R = 10, Tp = 14, Bm = 22, pw = W - L - R, ph = h - Tp - Bm, n = labels.length;
  let mn = pts.length ? Math.min(...pts.map(p => p[1])) : Infinity, mx = pts.length ? Math.max(...pts.map(p => p[1])) : -Infinity;
  if (ref && ref.v >= mn - 3 && ref.v <= mx + 3){ mn = Math.min(mn, ref.v); mx = Math.max(mx, ref.v); }
  if (plan){ mn = Math.min(mn, ...plan); mx = Math.max(mx, ...plan); }
  const padv = Math.max(.6, (mx - mn) * .18); mn -= padv; mx += padv;
  const step = niceStep((mx - mn) / 3), lo = Math.floor(mn / step) * step, hi = Math.ceil(mx / step) * step;
  const x = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1)), y = v => Tp + ph - (v - lo) / (hi - lo) * ph;
  const planPath = plan ? `<path class="ref" fill="none" d="${plan.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}"/><text class="reft" x="${x(n - 1) - 4}" y="${y(plan[n - 1]) + 13}" text-anchor="end">plan</text>` : "";
  let g = "", hits = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 7}" y="${y(v) + 3}" text-anchor="end">${esc(yfmt(v))}</text>`;
  const every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(pw / 70))));
  labels.forEach((lab, i) => { if (i % every === 0 || i === n - 1) g += `<text class="ax" x="${x(i)}" y="${h - 6}" text-anchor="middle">${esc(lab)}</text>`; });
  if (ref && ref.v >= lo && ref.v <= hi) g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref.v)}" y2="${y(ref.v)}"/><text class="reft" x="${W - R}" y="${y(ref.v) - 5}" text-anchor="end">${esc(ref.l)}</text>`;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const showAll = pts.length <= Math.floor(pw / 14);
  const marks = pts.filter((p, i) => showAll || i === pts.length - 1).map((p, i) => `<circle class="mk" style="--j:${i}" cx="${x(p[0])}" cy="${y(p[1])}" r="4.5" fill="${color}"/>`).join("");
  const sw = pw / Math.max(1, n - 1);
  values.forEach((v, i) => { if (v == null) return; hits += `<rect class="hit" x="${x(i) - sw / 2}" y="${Tp}" width="${sw}" height="${ph}" data-tip="${esc(tips ? tips(i) : labels[i] + " · " + yfmt(v))}"/><rect class="hv" x="${x(i) - 1}" y="${Tp}" width="2" height="${ph}" style="fill-opacity:.35"/>`; });
  return `<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img" aria-label="Graphique">${g}${planPath}<path class="ln" stroke="${color}" d="${path}"/>${marks}${hits}</svg>`;
}

function showTip(el, x, y){

}

function nudges(today){

  const st = prepState(tm);
  if ((h >= 20 || h < 4) && (st === "tonight" || st === "late")) out.push({p:1, bad:1, ic:"plan", t:"Demain n'est pas préparé. Avant 23h, c'est non négociable.", a:`<button class="btn sm pri" data-open="${tm}">Préparer demain</button>`});

  if (lg.w == null && h >= 6 && h < 15) out.push({p:3, ic:"scale", t:"Tu t'es pesé ce matin ?", a:`<input class="in" inputmode="decimal" placeholder="kg" id="qW" aria-label="Poids en kilos"><button class="btn sm" data-act="qWeight">Noter</button>`});
  const cl = doc("biz").clients.filter(c => !c.done && c.when && c.when <= today);
  if (cl.length) out.push({p:3, ic:"biz", t:`${cl.length} client${cl.length > 1 ? "s" : ""} à rappeler : ${cl.slice(0, 2).map(c => esc(c.name)).join(", ")}${cl.length > 2 ? "…" : ""}`, a:`<button class="btn sm" data-go="biz" data-sub="clients">Voir</button>`});

function md(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", list = null;
  for (const ln of lines){
    const ul = ln.match(/^\s*[-•*]\s+(.*)/), ol = ln.match(/^\s*\d+[.)]\s+(.*)/), hd = ln.match(/^\s*#{1,4}\s+(.*)/);
    if (ul || ol){ const ty = ul ? "ul" : "ol"; if (list !== ty){ if (list) out += `</${list}>`; out += `<${ty}>`; list = ty; } out += `<li>${(ul || ol)[1]}</li>`; continue; }
    if (list){ out += `</${list}>`; list = null; }
    if (hd) out += `<p><b>${hd[1]}</b></p>`; else if (ln.trim()) out += `<p>${ln}</p>`;
  }
  if (list) out += `</${list}>`;
  return out;
}

function skillAuto(id, G){
  const st = G.stats, ctx = G.ctx, sum = m => Object.values(m).reduce((a, v) => a + v, 0);
  switch (id){
    case "calls": return st.calls; case "rdv": return st.rdv * 10; case "closing": return st.closeDone * 30 + st.signed * 100;
    case "scripts": return sum(ctx.scr) * 15; case "shot": return sum(ctx.shot) * 20; case "published": return st.videos * 40;
    case "followers": return st.followers; case "prepared": { let n = 0; for (let k = START; k <= G.today; k = addDays(k, 1)) if (prepState(k) === "ok") n++; return n * 20; }
    case "cashlog": return doc("money").cash.length * 15; case "streak": return st.streak * 15 + st.prepStreak * 5;
    case "objections": return (doc("growth").logs || []).filter(l => l.node === "obj").length * 0;
    default: return 0;
  }
}
function nodeXP(n, G){ const gr = doc("growth"), man = (gr.logs || []).filter(l => l.node === n.id).reduce((a, l) => a + (+l.min || 0), 0); return man + (n.auto ? skillAuto(n.auto, G) : 0); }
const nodeLv = xp => { let l = 0; SKILL_LV.forEach((v, i) => { if (xp >= v) l = i; }); return l; };
function treeState(G){
  const out = {};
  TREE.forEach(br => { let prevLv = 5; br.nodes.forEach((n, i) => { const xp = nodeXP(n, G), lv = nodeLv(xp), lock = !br.free && i > 0 && prevLv < 1; const nx = SKILL_LV[Math.min(5, lv + 1)], cu = SKILL_LV[lv];
    out[n.id] = {xp, lv, lock, p:lv >= 5 ? 100 : (xp - cu) / Math.max(1, nx - cu) * 100}; prevLv = lv; }); });
  return out;
}

function drawTreeLinks(){
  const t = $("tree"), svg = $("treeLinks"); if (!t || !svg) return;
  const tb = t.getBoundingClientRect(); let d = "", on = "";

      const seg2 = `M${x1} ${y1 + 3} C${x1} ${(y1 + y2) / 2} ${x2} ${(y1 + y2) / 2} ${x2} ${y2 - 3} `;
      if (ns[i].closest(".nd").classList.contains("lock")) d += seg2; else on += seg2; } });

}
function radarSvg(axes){
  const W = 420, c = W / 2, R = 150, n = axes.length, pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [c + Math.cos(a) * R * v / 10, c + Math.sin(a) * R * v / 10]; };
  let s = "";
  [2.5, 5, 7.5, 10].forEach(v => { s += `<polygon class="grd" points="${axes.map((_, i) => pt(i, v).join(",")).join(" ")}"/>`; });
  axes.forEach((a, i) => { const [x, y] = pt(i, 10), [lx, ly] = pt(i, 11.6); s += `<line class="ax2" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${esc(a.n)}</text>`; });
  if (axes.some(a => a.pv)) s += `<polygon class="prev" points="${axes.map((a, i) => pt(i, a.pv).join(",")).join(" ")}"/>`;
  if (axes.some(a => a.v)) s += `<polygon class="cur" points="${axes.map((a, i) => pt(i, a.v).join(",")).join(" ")}"/>`;
  if (axes.some(a => a.m)) s += `<polygon class="meas" points="${axes.map((a, i) => pt(i, Math.max(.25, a.m || 0)).join(",")).join(" ")}"/>` + axes.map((a, i) => { const [x, y] = pt(i, Math.max(.25, a.m || 0)); return `<circle class="mdot" cx="${x}" cy="${y}" r="3.5"/>`; }).join("");

}

/* ================= BASE SUPABASE =================
   La vraie base de suivi, hors de claude.ai : Postgres + connexion email/mot de passe.
   Configurée par window.OZ_SUPA (dans p2_body.html). Si elle n'est pas configurée,
   l'app retombe sur la base de l'artifact Claude, puis sur le seul localStorage.
   Rien ici ne touche à la fusion des documents : on expose la même forme que la
   collection Claude (get / onSnapshot / doc().set) pour ne pas réécrire la synchro. */
const SUPA = {
  url: String((window.OZ_SUPA && window.OZ_SUPA.url) || "").replace(/\/+$/, ""),
  key: String((window.OZ_SUPA && window.OZ_SUPA.key) || ""),
  table: "docs",
};
SUPA.on = !!(SUPA.url && SUPA.key);
const SKEY = "oz30-session";

/* ---------- session ---------- */
let SESS = null;
function sessLoad(){ try { SESS = JSON.parse(localStorage.getItem(SKEY) || "null"); } catch(e){ SESS = null; } return SESS; }
function sessSave(j){
  if (!j || !j.access_token) return null;
  SESS = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in || 3600) * 1000 - 60000, email:(j.user && j.user.email) || (SESS && SESS.email) || ""};
  try { localStorage.setItem(SKEY, JSON.stringify(SESS)); } catch(e){}
  return SESS;
}
function sessClear(){ SESS = null; try { localStorage.removeItem(SKEY); } catch(e){} }

async function supaAuth(path, body){
  const r = await fetch(`${SUPA.url}/auth/v1/${path}`, {
    method:"POST", headers:{apikey:SUPA.key, "Content-Type":"application/json"}, body:JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || `Erreur ${r.status}`);
  return j;
}
const supaLogin = (email, password) => supaAuth("token?grant_type=password", {email, password}).then(sessSave);
const supaSignup = (email, password) => supaAuth("signup", {email, password}).then(j => j.access_token ? sessSave(j) : null);

/* jeton valide, rafraîchi au besoin ; null si la session est morte */
let refreshing = null;
async function supaToken(){
  if (!SESS) sessLoad();
  if (!SESS) return null;
  if (Date.now() < SESS.expires_at) return SESS.access_token;
  if (!SESS.refresh_token){ sessClear(); return null; }
  if (!refreshing){
    refreshing = supaAuth("token?grant_type=refresh_token", {refresh_token:SESS.refresh_token})
      .then(sessSave).catch(() => { sessClear(); return null; }).finally(() => { refreshing = null; });
  }
  const s = await refreshing;
  return s ? s.access_token : null;
}

/* ---------- lecture / écriture des documents ---------- */
async function supaReq(path, opt = {}){
  const tok = await supaToken();
  if (!tok) throw new Error("session");
  const r = await fetch(`${SUPA.url}/rest/v1/${path}`, {
    ...opt,
    headers:{apikey:SUPA.key, Authorization:`Bearer ${tok}`, "Content-Type":"application/json", ...(opt.headers || {})},
  });
  if (!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error(`${r.status} ${t.slice(0, 200)}`);
  }
  return r.status === 204 ? null : r.json().catch(() => null);
}
async function supaAll(){
  const rows = await supaReq(`${SUPA.table}?select=id,data`) || [];
  return rows.map(r => ({id:r.id, data:r.data}));
}
const supaSet = (id, data) => supaReq(`${SUPA.table}?on_conflict=user_id,id`, {
  method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
  body:JSON.stringify([{id, data, updated_at:data.updatedAt || Date.now()}]),
});

/* même forme que la collection Claude : la synchro de p3 ne voit pas la différence */
function supaCol(){
  let poll = null;
  return {
    get: async () => ({docs: await supaAll()}),
    doc: id => ({set: data => supaSet(id, data)}),
    onSnapshot(cb, err){
      const tick = () => supaAll().then(docs => cb({docs, metadata:{fromCache:false}})).catch(e => {
        if (String(e && e.message) === "session"){ clearInterval(poll); COL = null; loginView("Ta session a expiré. Reconnecte-toi, rien n'est perdu."); return; }
        if (err) err(e);
      });
      tick(); clearInterval(poll); poll = setInterval(() => { if (document.visibilityState === "visible") tick(); }, 45000);
    },
  };
}

/* ---------- import d'une sauvegarde JSON ---------- */
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let j; try { j = JSON.parse(String(r.result)); } catch(e){ toast("Fichier illisible : ce n'est pas un .json valide."); return; }
    const docs = j && j.docs ? j.docs : j;
    if (!docs || typeof docs !== "object"){ toast("Aucun document trouvé dans ce fichier."); return; }
    const ids = Object.keys(docs).filter(k => docs[k] && typeof docs[k] === "object");
    if (!ids.length){ toast("Aucun document trouvé dans ce fichier."); return; }
    let n = 0;
    ids.forEach(id => {
      const o = docs[id], cur = S.store[id];
      if (cur && (cur.updatedAt || 0) >= (o.updatedAt || 0)) return; // on n'écrase jamais plus récent
      S.store[id] = id.startsWith("d-") ? norm(clone(o)) : clone(o);
      if (id.startsWith("d-")) delete S.drafts[id.slice(2)];
      persist(id); n++;
    });
    toast(n ? `${n} document${n > 1 ? "s" : ""} importé${n > 1 ? "s" : ""}.` : "Déjà à jour : rien à importer.");
    S.gReady = false; render();
  };
  r.readAsText(file);
}

/* =========================================================
   PROGRESSION — les 180 jours, les quatre piliers, la régularité.
   Rien n'est inventé : tout vient des journées enregistrées.
   Une case vide affiche « — », jamais un chiffre d'exemple.
   ========================================================= */

/* une journée compte comme remplie dès qu'une donnée y a été saisie */
function dayFilled(d){
  if (!d || !d.log) return false;
  const l = d.log, c = l.calls || {m:{}, o:{}}, dn = dinOf(d);
  if ((c.m.c || 0) + (c.o.c || 0) > 0) return true;
  if (onTimeOf(dn) > 0 || (dn.q || 0) > 0 || dn.am || dn.pm || dn.tah) return true;
  if (l.w != null || l.kcal != null || l.prot != null || l.steps || l.walk || l.med || l.fast != null) return true;
  if (d.validatedAt || d.review || d.win || d.grat) return true;
  if (d.reqs && Object.values(d.reqs).some(Boolean)) return true;
  if ((d.tasks || []).some(t => t.done)) return true;
  return false;
}

function progStats(){
  const today = logicalToday(), st = g().stats, ctx = g().ctx;
  let elapsed = 0, filled = 0, planned = 0;
  const months = {};
  for (let k = START; k <= today; k = addDays(k, 1)){
    elapsed++;
    const m = k.slice(0, 7), mo = months[m] || (months[m] = {k:m, filled:0, calls:0, rdv:0, cash:0, pray:0, quran:0, days:0});
    mo.days++;
    const d = savedDay(k);
    if (!d) continue;
    if (hasPlan(d)) planned++;
    if (dayFilled(d)){ filled++; mo.filled++; }
    const c = d.log.calls, dn = dinOf(d);
    mo.calls += (c.m.c || 0) + (c.o.c || 0);
    mo.rdv += (c.m.r || 0) + (c.o.r || 0);
    mo.pray += onTimeOf(dn); mo.quran += dn.q || 0;
    mo.cash += ctx.cash[k] || 0;
  }
  return {today, st, ctx, elapsed, filled, planned, left:Math.max(0, diffDays(today, END)), months:Object.values(months)};
}

/* projection honnête : le rythme constaté, prolongé jusqu'au 30 avril */
function progPace(p){
  const weeksDone = Math.max(1, p.elapsed / 7), weeksLeft = p.left / 7;
  return {
    weeksLeft,
    cashWeek: p.st.cash / weeksDone,
    cashEnd: p.st.cash + (p.st.cash / weeksDone) * weeksLeft,
    callsDay: p.st.calls / Math.max(1, p.elapsed),
    kgWeek: p.st.lost / weeksDone,
    kgEnd: p.st.lost + (p.st.lost / weeksDone) * weeksLeft,
  };
}

/* =========================================================
   À REMPLIR — ce qui reste à noter aujourd'hui.
   Une seule source : la journée enregistrée. Chaque ligne pointe
   vers l'écran où ça se remplit, et alimente la pastille du rail.
   ========================================================= */
const PRAY_L = {f:"Fajr", d:"Dohr", a:"Asr", m:"Maghrib", i:"Isha"};

function fillTodo(){
  const today = logicalToday(), d = getDay(today), lg = d.log || {}, st = settings();
  const we = ["sam", "dim"].includes(codeOf(today)), h = new Date().getHours();
  const out = [];
  const add = (view, t, urgent) => out.push({view, t, urgent:!!urgent});

  /* la journée est-elle préparée ? */
  if (!hasPlan(savedDay(today))) add("plan", "Préparer ta journée", true);
  const ps = prepState(addDays(today, 1));
  if ((h >= 18 || h < 4) && (ps === "tonight" || ps === "late")) add("plan", "Préparer demain", ps === "late");

  /* business : jours ouvrés seulement */
  const c = lg.calls || {m:{}, o:{}};
  if (!we && ((c.o.c || 0) + (c.m.c || 0)) === 0 && h >= 11) add("biz", "Noter tes appels du jour");

  /* dîn : prières non notées, et seulement celles dont l'heure est passée */
  const dn = dinOf(d), p = dn.p || {}, pt = prayerTimes(today);
  const late = ["f", "d", "a", "m", "i"].filter(k => !p[k] && pt && pt[k] != null && nowMin() >= pt[k]);
  if (late.length) add("din", late.length === 1 ? `Noter ${PRAY_L[late[0]]}` : `Noter ${late.length} prières`);

  /* corps */
  if (lg.w == null && h >= 7) add("body", "Te peser");
  if (!lg.kcal && h >= 18) add("body", "Noter ton repas");

  /* le bilan du soir */
  if (!d.review && h >= 21) add("today", "Faire ton bilan du soir");

  /* coach : 3 questions par jour */
  const jn = (doc("coach").journal || []).filter(x => x.d === today).length;
  if (jn < 3 && h >= 12) add("coach", jn ? "Finir les questions du coach" : "Répondre au coach");

  /* missions en retard et clients à rappeler : déjà des engagements pris */
  const over = doc("tasks").items.filter(t => !t.done && t.due && t.due <= today).length;
  if (over) add("tasks", `${over} mission${over > 1 ? "s" : ""} en retard`, true);
  const cl = doc("biz").clients.filter(x => !x.done && x.when && x.when <= today).length;
  if (cl) add("biz", `${cl} client${cl > 1 ? "s" : ""} à rappeler`, true);

  const byView = {};
  out.forEach(o => { byView[o.view] = (byView[o.view] || 0) + 1; });
  return {items:out, byView, n:out.length};
}

/* ---------- Dubaï · 31 décembre ---------- */
function dubai(){
  const st = settings(), tg = st.targets, due = tg.cashDate || "2026-12-31";
  const cash = g().stats.cash, left = Math.max(0, tg.cash - cash);
  const days = Math.max(0, diffDays(logicalToday(), due));
  const weeks = Math.max(1, days / 7);
  return {due, cash, left, days, weeks, perWeek:left / weeks, pct:clampP(cash / Math.max(1, tg.cash) * 100), goal:tg.cash};
}

const ptOf = (e, el) => { if (e && (e.clientX || e.clientY)) return {x:e.clientX, y:e.clientY}; const r = el ? el.getBoundingClientRect() : {left:innerWidth / 2, top:innerHeight / 2, width:0, height:0}; return {x:r.left + r.width / 2, y:r.top + r.height / 2}; };

function setStatus(k, i, st, pt){

  if (ds.walk){ const v = +ds.walk; mutateDay(today, d => { d.log.walk = Math.max(0, (d.log.walk || 0) + v); const rq = reqMatch(/marche/i); if (rq && d.log.walk >= 30) d.reqs[rq] = true; }); if (v > 0) toast(`+${v} min · ≈ ${nf(stepsOf(v))} pas`); return; }
  if (ds.fast){ const v = ds.fast === "1"; mutateDay(today, d => { d.log.fast = d.log.fast === v ? null : v; const rq = reqMatch(/jeûne|jeune/i); if (rq) d.reqs[rq] = d.log.fast === true; if (d.log.fast === true) S.flash = "fast"; }); if (getDay(today).log.fast === true){ const pt = ptOf(e, el); burst(pt.x, pt.y, 16); toast(`Jeûne tenu · ${fastCount()} jour${fastCount() > 1 ? "s" : ""} sur ${settings().fast.days}.`); } return; }
  if (ds.fastday){ const dk = ds.fastday; mutateDay(dk, d => { d.log.fast = d.log.fast === true ? false : d.log.fast === false ? null : true; const rq = reqMatch(/jeûne|jeune/i); if (rq) d.reqs[rq] = d.log.fast === true; }); return; }
  if (ds.mok){ const v = +ds.mok, wk = mondayOf(today); mutateWeek(wk, w => { w.mOk = Math.max(0, (+w.mOk || 0) + v); }); if (v > 0){ const pt = ptOf(e, el); burst(pt.x, pt.y, 14); toast(`RDV validé · +${settings().targets.rdvValue} €`); } return; }

  /* planning */
  if (ds.tpl){ loadTpl(k, ds.tpl); return; }
  if (ds.add){ const key = ds.add, ty = T(key), id = uid(); mutateDay(k, d => d.blocks.push({type:key, dur:ty.d, title:ty.l, pin:null, id, status:null, subs:(TYPES[key] && TYPES[key].subs || []).map(s => ({t:s, done:false}))})); S.flash = id; render(); return; }
  if (ds.deltype){ mutateSettings(s => { s.customTypes = s.customTypes.filter(c => c.key !== ds.deltype); }); return; }
  if (ds.ntfam){ S.newType.label = valOf("nt-name"); S.newType.fam = ds.ntfam; render(); setTimeout(() => { const n = $("nt-name"); if (n) n.focus(); }, 0); return; }
  if (ds.subdel != null){ mutateDay(k, d => d.blocks[i].subs.splice(+ds.subdel, 1)); return; }
  if (ds.reqdel){ mutateSettings(s => { s.reqs = s.reqs.filter(r => r.id !== ds.reqdel); }); return; }
  if (ds.tdel){ const ti = +ds.ti; if (ds.tdel === "w") mutateWeek(S.weekOf, w => w.tasks.splice(ti, 1)); else mutateDay(k, d => d.tasks.splice(ti, 1)); return; }
  if (ds.tmove){ const ti = +ds.ti, task = getDay(k).tasks[ti]; if (!task) return; mutateDay(addDays(k, 1), d => d.tasks.push({id:uid(), t:task.t, done:false, tid:task.tid}), false); mutateDay(k, d => d.tasks.splice(ti, 1)); toast("Reportée à demain."); return; }

  /* tâches */
  if (ds.tkto){ const [id, dd] = ds.tkto.split(":"), task = doc("tasks").items.find(x => x.id === id); if (!task) return; const day = addDays(today, +dd);
    if (getDay(day).tasks.some(x => x.tid === id)){ toast("Déjà dans cette journée."); return; }
    mutateDay(day, d => d.tasks.push({id:uid(), t:task.t, done:false, tid:id})); toast(`Ajoutée à ${dd === "1" ? "demain" : "aujourd'hui"}.`); return; }
  if (ds.tkstar){ mut("tasks", td => { const x = td.items.find(y => y.id === ds.tkstar); if (x) x.star = !x.star; }); return; }
  if (ds.tkdel){ mut("tasks", td => { td.items = td.items.filter(y => y.id !== ds.tkdel); }); return; }

  /* business */
  if (ds.axdel){ mut("biz", b => { b.axes = b.axes.filter(a => a.id !== ds.axdel); }); return; }
  if (ds.cmv){ const [id, dv] = ds.cmv.split(":"); let pub = false;
    mut("biz", b => { const it = b.content.find(x => x.id === id); if (!it) return; const from = it.stage || 0, to = Math.max(0, Math.min(4, from + +dv)); it.ts = it.ts || {};
      if (to > from) it.ts[to] = Date.now(); else delete it.ts[from]; it.stage = to; pub = to === 4 && from === 3; S.flash = id; });
    if (pub){ const pt = ptOf(e, el), wk = mondayOf(today); burst(pt.x, pt.y, 22); toast(`Publiée ! ${contentStats(wk, addDays(wk, 6))[4]}/${settings().targets.posts} cette semaine.`); } return; }
  if (ds.cdel){ mut("biz", b => { b.content = b.content.filter(x => x.id !== ds.cdel); }); return; }
  if (ds.cldone){ mut("biz", b => { const c = b.clients.find(x => x.id === ds.cldone); if (c){ c.done = true; c.doneAt = Date.now(); } }); toast("Rappelé. Note la suite si besoin."); return; }
  if (ds.clundo){ mut("biz", b => { const c = b.clients.find(x => x.id === ds.clundo); if (c) c.done = false; }); return; }
  if (ds.cldel){ mut("biz", b => { b.clients = b.clients.filter(x => x.id !== ds.cldel); }); return; }
  if (ds.cdl){ if (!confirmTap(el, "cdl" + ds.cdl)) return; mut("biz", b => { b.closings = b.closings.filter(x => x.id !== ds.cdl); }); return; }
  if (ds.ntdel){ mut("biz", b => { b.notes = b.notes.filter(x => x.id !== ds.ntdel); }); return; }
  if (ds.iddel){ mut("biz", b => { b.ideas = b.ideas.filter(x => x.id !== ds.iddel); }); return; }
  if (ds.idtask){ const idea = doc("biz").ideas.find(x => x.id === ds.idtask); if (!idea) return; const area = {biz:"biz", lead:"biz", perso:"cont", invest:"argent", din:"din"}[idea.cat] || "perso";
    mut("tasks", td => td.items.push({id:uid(), t:idea.t, area, star:false, due:null, done:false, created:Date.now()}), false);
    mut("biz", b => { const x = b.ideas.find(y => y.id === ds.idtask); if (x) x.task = true; }); toast("Ajoutée à tes tâches."); return; }

  /* argent */
  if (ds.cashdel){ if (!confirmTap(el, "cash" + ds.cashdel)) return; mut("money", m => { m.cash = m.cash.filter(x => x.id !== ds.cashdel); }); return; }
  if (ds.dtotal){ const v = num(valOf("dt-" + ds.dtotal)); if (v == null || v <= 0){ toast("Entre un montant."); return; } mut("money", m => { const d = m.debts.find(x => x.id === ds.dtotal); if (d) d.total = v; }); return; }
  if (ds.dpay){ const v = num(valOf("dp-" + ds.dpay)); if (v == null || v <= 0){ toast("Entre le montant remboursé."); return; } const pt = ptOf(e, el); let cleared = false;
    mut("money", m => { const d = m.debts.find(x => x.id === ds.dpay); if (!d) return; d.pays = d.pays || []; d.pays.push({date:today, amount:v}); cleared = debtLeft(d) === 0; });
    if (cleared){ burst(pt.x, pt.y, 26); toast("Dette remboursée. Une chaîne en moins."); } else toast(`${eur(v)} remboursés.`); return; }
  if (ds.ddel){ if (!confirmTap(el, "debt" + ds.ddel)) return; mut("money", m => { m.debts = m.debts.filter(x => x.id !== ds.ddel); }); return; }

  /* mindset */
  if (ds.afdel != null){ mut("mind", m => m.aff.splice(+ds.afdel, 1)); return; }
  if (ds.bddel != null){ mut("mind", m => m.board.splice(+ds.bddel, 1)); return; }
  if (ds.codedel != null){ mut("mind", m => m.code.splice(+ds.codedel, 1)); return; }
  if (ds.duadel != null){ mut("mind", m => m.duas.splice(+ds.duadel, 1)); return; }
  if (ds.trdel != null){ mut("mind", m => { m.truths = (m.truths || []).filter((_, j) => j !== +ds.trdel); }); return; }
  if (ds.bkdel){ if (!confirmTap(el, "bk" + ds.bkdel)) return; mut("mind", m => { m.books = m.books.filter(x => x.id !== ds.bkdel); }); return; }
  if (ds.moddel){ mut("mind", m => { m.modules = m.modules.filter(x => x.id !== ds.moddel); }); return; }
  if (ds.modstep){ const [id, dv] = ds.modstep.split(":"); mut("mind", m => { const x = m.modules.find(y => y.id === id); if (x) x.done = Math.max(0, Math.min(x.total || 999, (x.done || 0) + +dv)); }); return; }
  if (ds.med){ openMed(+ds.med); return; }

  switch (ds.act){
    case "theme": { const ix = THEMES.findIndex(x => x[0] === theme); setTheme(THEMES[(ix + 1) % 3][0]); break; }
    case "affRead": openAff("aff"); break;
    case "truthRead": openAff("truth"); break;
    case "truthDone": closeOver(); break;
    case "resync": if (S.resync){ toast("Synchronisation…"); S.resync().then(ok => toast(ok ? "Données à jour." : "Pas de connexion à ta base pour l'instant.")); } else toast("Ouvre l'app depuis claude.ai pour synchroniser."); break;
    case "export": exportData(); break;
    case "bkCopy": copyBackup(); break;
    case "affNext": if (S.reader && S.affI < S.reader.list.length){ S.affI++; paintAff(); } break;
    case "affPrev": S.affI = Math.max(0, S.affI - 1); paintAff(); break;
    case "affAuto": if (S.affAuto) stopAffAuto(); else { S.affAuto = true; affTimer = setInterval(() => { S.affI++; paintAff(); }, 4500); } paintAff(); break;
    case "affDone": { const pt = ptOf(e, el); mutateDay(today, d => { d.log.aff = true; const rq = reqMatch(/affirmation/i); if (rq) d.reqs[rq] = true; }, false); burst(pt.x, pt.y, 30); closeOver(); toast("Monologue relu. Tu es déjà lui."); break; }
    case "closeOver": closeOver(); break;
    case "medStop": finishMed(false); break;
    case "boardPrev": S.boardI--; paintBoard(); break;
    case "boardNext": S.boardI++; paintBoard(); break;
    case "qWeight": { const v = num(valOf("qW")); if (v == null || v < 30 || v > 300){ toast("Entre ton poids en kg, ex. 131,4"); break; } mutateDay(today, d => { d.log.w = v; }); toast(`${nf1(v)} kg noté.`); break; }
    case "undoCnt": { const L = S.lastCnt; if (!L) break; S.lastCnt = null; mutateDay(L.k, d => { const c = d.log.calls[L.w]; c.c = Math.max(0, c.c - 1); if (L.kind !== "n") c.a = Math.max(0, c.a - 1); if (L.kind === "r") c.r = Math.max(0, c.r - 1); }); toast("Dernier appel annulé."); break; }
    case "fixToggle": S.fixOpen = !S.fixOpen; render(); break;
    case "prevWeek": S.weekOf = addDays(S.weekOf, -7); S.enter = true; render(); break;
    case "nextWeek": S.weekOf = addDays(S.weekOf, 7); S.enter = true; render(); break;
    case "thisWeek": S.weekOf = mondayOf(today); S.enter = true; render(); break;
    case "prevDay": S.dayKey = addDays(S.dayKey, -1); S.undo = null; S.enter = true; render(); break;
    case "nextDay": S.dayKey = addDays(S.dayKey, 1); S.undo = null; S.enter = true; render(); break;
    case "inc": mutateDay(k, d => { d.blocks[i].dur += d.blocks[i].dur < 15 ? 5 : 15; }); break;
    case "dec": mutateDay(k, d => { const b = d.blocks[i]; b.dur = Math.max(5, b.dur - (b.dur <= 15 ? 5 : 15)); }); break;
    case "del": { const prev = clone(getDay(k).blocks); S.undo = {k, prev, msg:"Tâche supprimée."}; mutateDay(k, d => d.blocks.splice(i, 1)); break; }
    case "unpin": mutateDay(k, d => { d.blocks[i].pin = null; }); break;
    case "fixstart": { const x = layout(getDay(k).blocks)[i]; if (x && x.clash) mutateDay(k, d => { d.blocks[i].pin = x.clash.end; }); break; }
    case "subs": { const id = getDay(k).blocks[i].id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); break; }
    case "undo": if (S.undo && S.undo.prev){ const u = S.undo; S.undo = null; mutateDay(u.k, d => { d.blocks = u.prev; }); } break;
    case "clear": { const prev = clone(getDay(k).blocks); S.undo = {k, prev, msg:"Programme effacé."}; mutateDay(k, d => { d.blocks = []; }); break; }
    case "copyPrev": {
      const src = savedDay(addDays(k, -1));
      if (!hasPlan(src)){ S.undo = {k, prev:null, msg:"La veille n'a pas de programme enregistré."}; render(); break; }
      const prev = clone(getDay(k).blocks); S.undo = {k, prev: prev.length ? prev : null, msg:"Programme de la veille copié."};
      mutateDay(k, d => { d.blocks = fresh(src.blocks); }); break;
    }
    case "addMeridia": mutateDay(k, d => { d.blocks.push({type:"meridia", dur:90, title:TYPES.meridia.l, pin:H(10, 30), id:uid(), status:null, subs:[]}); placeAt(d.blocks, d.blocks.length - 1, H(10, 30)); }); break;
    case "validate": {
      const d = getDay(k), probs = layout(d.blocks).filter(x => x.clash).length;
      if (!d.validatedAt && probs){ toast(`Corrige d'abord ${probs} horaire${probs > 1 ? "s" : ""} impossible${probs > 1 ? "s" : ""}.`); break; }
      const pt = ptOf(e, el);
      mutateDay(k, dd => { dd.validatedAt = dd.validatedAt ? null : Date.now(); });
      if (getDay(k).validatedAt){ burst(pt.x, pt.y, 34); toast(k === addDays(today, 1) ? "Demain est prêt. Tu dors en ayant déjà gagné la journée." : "Planning validé. Tu t'y tiens."); }
      break;
    }
    case "newType": S.newType = {label:"", fam:"biz"}; render(); setTimeout(() => { const n = $("nt-name"); if (n) n.focus(); }, 0); break;
    case "cancelType": S.newType = null; render(); break;
    case "createType": {
      const label = valOf("nt-name"); if (!label){ const n = $("nt-name"); if (n) n.focus(); break; }
      const key = "c-" + uid(), fam = S.newType.fam, id = uid(); S.newType = null;
      mutateSettings(s => { s.customTypes.push({key, label, fam}); }, false);
      mutateDay(k, d => d.blocks.push({type:key, dur:30, title:label, pin:null, id, status:null, subs:[]}));
      break;
    }
    case "newStar": S.newStar = !S.newStar; el.setAttribute("aria-pressed", String(S.newStar)); break;
    case "stopCoach": if (S.coachCtl) S.coachCtl.abort(); break;
    case "clearCoach": if (!confirmTap(el, "coach")) break; mut("coach", c => { c.msgs = []; }); break;
  }
});

/* ---------- formulaires ---------- */
document.addEventListener("submit", e => {
  const f = e.target; if (!f.closest("#view")) return; e.preventDefault();
  const fd = f.dataset, today = logicalToday(), k = dayK();
  const first = f.querySelector("input, textarea"), v = first ? first.value.trim() : "", refocus = first ? first.id : null;
  const back = () => { if (refocus){ const n = $(refocus); if (n) n.focus(); } };
  if (fd.coach){ const ta = $("coachIn"); ask(ta ? ta.value : ""); return; }
  if (!v && !fd.cashadd && !fd.sadadd && !fd.closadd) return;
  if (fd.tadd === "w") mutateWeek(S.weekOf, w => w.tasks.push({id:uid(), t:v, done:false}));
  else if (fd.tadd === "d") mutateDay(k, d => d.tasks.push({id:uid(), t:v, done:false}));
  else if (fd.subadd != null) mutateDay(k, d => d.blocks[+fd.subadd].subs.push({t:v, done:false}));
  else if (fd.reqadd) mutateSettings(s => s.reqs.push({id:"r" + uid(), t:v}));
  else if (fd.tkadd){ const id = uid(); mut("tasks", td => td.items.push({id, t:v, area:valOf("tk-area") || "biz", star:!!S.newStar, due:valOf("tk-due") || null, done:false, created:Date.now()}), false); S.newStar = false; S.flash = id; render(); }
  else if (fd.axadd) mut("biz", b => b.axes.push({id:uid(), t:v, done:false}));
  else if (fd.cadd){ const id = uid(); mut("biz", b => b.content.push({id, t:v, acc:valOf("c-acc") || "perso", stage:0, ts:{0:Date.now()}}), false); S.flash = id; render(); }
  else if (fd.cladd) mut("biz", b => b.clients.push({id:uid(), name:v, phone:valOf("cl-phone"), why:valOf("cl-why"), when:valOf("cl-when") || addDays(today, 1), co:valOf("cl-co") || "oz", done:false}));
  else if (fd.closadd){ const c = valOf("cs-client"); if (!c){ back(); return; } const amt = num(valOf("cs-amount")), r = f.querySelector("button[type=submit]").getBoundingClientRect();
    mut("biz", b => b.closings.push({id:uid(), client:c, amount:amt, date:valOf("cs-date") || today}));
    burst(r.left + r.width / 2, r.top, 40); const n = closingsCount(); toast(`Closing signé ! ${n}/${settings().targets.closings}. Al hamdulillah.`); return; }
  else if (fd.ntadd){ const txt = valOf("nt-txt"); if (!txt) return; mut("biz", b => b.notes.push({id:uid(), src:valOf("nt-src"), t:txt, date:today, ts:Date.now()})); toast("Noté. Applique-le dès demain."); return; }
  else if (fd.idadd) mut("biz", b => b.ideas.unshift({id:uid(), t:v, cat:valOf("id-cat") || "biz"}));
  else if (fd.cashadd){ const amt = num(valOf("ca-amt")); if (amt == null || amt <= 0){ toast("Entre le montant encaissé."); return; } const r = f.querySelector("button[type=submit]").getBoundingClientRect();
    mut("money", m => m.cash.push({id:uid(), amount:amt, src:valOf("ca-src") || "autre", label:valOf("ca-lbl"), date:valOf("ca-date") || today, ts:Date.now()}));
    burst(r.left + r.width / 2, r.top, 24); const tg = settings().targets, left = Math.max(0, tg.cash - cashSum(START, tg.cashDate)); toast(`+${eur(amt)}. ${left ? `Reste ${eur(left)} pour Dubaï.` : "Objectif Dubaï atteint !"}`); return; }
  else if (fd.debtadd){ const tot = num(valOf("db-total")); mut("money", m => m.debts.push({id:uid(), who:v, total:tot && tot > 0 ? tot : null, pays:[]})); }
  else if (fd.schadd){ const amt = num(valOf("sc-amt")), n = Math.round(num(valOf("sc-n")) || 0), d0 = valOf("sc-date");
    if (amt == null || amt <= 0 || n < 1 || n > 48 || !d0){ toast("Il manque le montant par mois, le nombre d'échéances restantes ou la date."); return; }
    const sched = Array.from({length:n}, (_, i) => ({date:addMonths(d0, i), amount:amt}));
    mut("money", m => m.debts.push({id:uid(), who:v, via:`${n} échéance${n > 1 ? "s" : ""} restante${n > 1 ? "s" : ""}`, total:Math.round(amt * n * 100) / 100, sched, pays:[]})); toast(`Ajouté : ${eur2(amt * n)} prélevés jusqu'au ${shortDate(sched[n - 1].date)}`); }
  else if (fd.sadadd){ const amt = num(valOf("sd-amt")); if (amt == null || amt <= 0){ toast("Entre un montant."); return; } mut("money", m => m.sadaqa.push({id:uid(), amount:amt, label:valOf("sd-lbl"), date:today})); toast("Qu'Allah l'accepte."); return; }
  else if (fd.affadd) mut("mind", m => m.aff.push(v));
  else if (fd.boardadd) mut("mind", m => m.board.push(v));
  else if (fd.codeadd) mut("mind", m => m.code.push(v));
  else if (fd.duaadd) mut("mind", m => m.duas.push(v));
  else if (fd.truthadd) mut("mind", m => { m.truths = m.truths || []; m.truths.push(v); });
  else if (fd.bkadd){ const tot = num(valOf("bk-total")); mut("mind", m => m.books.push({id:uid(), t:v, a:"", kind:valOf("bk-kind") || "livre", unit:valOf("bk-kind") === "audio" ? "min" : "p.", total:tot && tot > 0 ? Math.round(tot) : null, cur:0})); }
  else if (fd.modadd){ const tot = num(valOf("md-total")); mut("mind", m => m.modules.push({id:uid(), t:v, src:"", total:tot && tot > 0 ? Math.round(tot) : null, done:0})); }
  back();
});

/* ---------- saisies ---------- */
document.addEventListener("change", e => {
  const el = e.target; if (!el.closest("#view")) return;
  const ds = el.dataset, k = dayK(), today = logicalToday();
  if (ds.req){ S.flash = el.id; let all = false; mutateDay(k, d => { d.reqs[ds.req] = el.checked; all = reqList().every(r => d.reqs[r.id]); }); if (all && el.checked){ const r = el.getBoundingClientRect(); burst(r.left + 10, r.top, 30); toast("Tous tes prérequis sont tenus. Respect."); } return; }
  if (ds.subck != null){ S.flash = el.id; mutateDay(k, d => { const b = d.blocks[+ds.subck]; if (b && b.subs[+ds.si]) b.subs[+ds.si].done = el.checked; }); return; }
  if (ds.gdone === "d"){ S.flash = el.id; mutateDay(k, d => { d.prios[+ds.gi].done = el.checked; }); return; }
  if (ds.gdone === "w"){ S.flash = el.id; mutateWeek(S.weekOf, w => { w.goals[+ds.gi].done = el.checked; }); return; }
  if (ds.tcheck){ S.flash = el.id; const ti = +ds.ti;
    if (ds.tcheck === "w") mutateWeek(S.weekOf, w => { w.tasks[ti].done = el.checked; });
    else { let tid = null; mutateDay(k, d => { d.tasks[ti].done = el.checked; tid = d.tasks[ti].tid; }, false);
      if (tid) mut("tasks", td => { const x = td.items.find(y => y.id === tid); if (x){ x.done = el.checked; x.doneAt = el.checked ? Date.now() : null; } }, false);
      render(); }
    return; }
  if (ds.logb){ S.flash = el.id; mutateDay(today, d => { d.log[ds.logb] = el.checked; }); return; }
  if (ds.log){ const raw = el.value.trim(), v = raw === "" ? null : num(raw);
    if (raw !== "" && (v == null || v < 0)){ toast("Valeur invalide."); render(); return; }
    if (ds.log === "w" && v != null && (v < 30 || v > 300)){ toast("Poids en kg, ex. 131,4"); render(); return; }
    mutateDay(today, d => { d.log[ds.log] = v; }); if (ds.log === "w" && v != null) toast(`${nf1(v)} kg noté.`); return; }
  if (ds.f === "start"){ const i = +el.closest("[data-i]").dataset.i, v = parseHM(el.value); if (v == null){ toast("Heure non reconnue. Tape par exemple 14h30."); render(); return; } mutateDay(k, d => placeAt(d.blocks, i, v)); return; }
  if (el.id === "tplsel" && el.value){ loadTpl(k, el.value); return; }
  if (ds.pick){ const task = doc("tasks").items.find(x => x.id === el.value); if (!task) return; const day = ds.pick === "d" ? k : today; mutateDay(day, d => d.tasks.push({id:uid(), t:task.t, done:false, tid:task.id})); return; }
  if (ds.tk){ S.flash = el.id; mut("tasks", td => { const x = td.items.find(y => y.id === ds.tk); if (x){ x.done = el.checked; x.doneAt = el.checked ? Date.now() : null; } });
    if (el.checked){ const d = savedDay(today); if (d && d.tasks.some(x => x.tid === ds.tk && !x.done)) mutateDay(today, dd => dd.tasks.forEach(x => { if (x.tid === ds.tk) x.done = true; })); }
    return; }
  if (ds.axis){ S.flash = el.id; mut("biz", b => { const a = b.axes.find(x => x.id === ds.axis); if (a) a.done = el.checked; }); return; }
  if (ds.site){ S.flash = el.id; mut("biz", b => { b.site = {...b.site, [ds.site]:el.checked}; }); return; }
  if (ds.bkcur){ const v = num(el.value); let done = false;
    mut("mind", m => { const b = m.books.find(x => x.id === ds.bkcur); if (!b || v == null) return; const was = b.total && b.cur >= b.total; b.cur = Math.max(0, Math.round(b.total ? Math.min(v, b.total) : v)); done = !was && b.total && b.cur >= b.total; });
    if (done){ const r = el.getBoundingClientRect(); burst(r.left, r.top, 30); toast("Livre terminé. Le suivant."); } return; }
  if (ds.bktotal){ const v = num(el.value); if (v == null || v <= 0) return; mut("mind", m => { const b = m.books.find(x => x.id === ds.bktotal); if (b) b.total = Math.round(v); }); return; }
  if (ds.set){ const [a, b] = ds.set.split("."), raw = el.value.trim(), isDate = el.type === "date", v = isDate ? raw : num(raw);
    if (v == null || v === "" || (!isDate && v < 0)){ toast("Valeur invalide."); render(); return; }
    mutateSettings(s => { s[a] = {...s[a], [b]:v}; }); toast("Enregistré."); return; }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.closest("#view")) return;
  const ds = el.dataset, k = dayK();
  if (ds.f === "title"){ const i = +el.closest("[data-i]").dataset.i; mutateDay(k, d => { d.blocks[i].title = el.value; }, false); const r = $("ruler"); if (r) r.innerHTML = rulerHtml(getDay(k).blocks, pph() * .78); return; }
  if (ds.goal === "d"){ mutateDay(k, d => { d.prios[+ds.gi].t = el.value; }, false); return; }
  if (ds.goal === "w"){ mutateWeek(S.weekOf, w => { w.goals[+ds.gi].t = el.value; }, false); return; }
  if (ds.txt){ mutateDay(logicalToday(), d => { d[ds.txt] = el.value; }, false); return; }
  if (ds.one){ mut("tasks", td => { td.one = el.value; }, false); return; }
  if (ds.pillar){ mutateSettings(s => { s.pillars = {...s.pillars, [ds.pillar]:el.value}; }, false); return; }
  if (el.id === "coachIn"){ S.coachDraft = el.value; el.style.height = "auto"; el.style.height = Math.min(160, el.scrollHeight) + "px"; }
});
document.addEventListener("keydown", e => {
  const ov = $("overlay").firstChild;
  if (ov){
    if (e.key === "Escape"){ e.preventDefault(); if (S.med) finishMed(false); else closeOver(); return; }
    if (!S.med && (e.key === "ArrowRight" || e.key === " ")){ e.preventDefault(); if (S.reader && S.affI < S.reader.list.length){ S.affI++; paintAff(); } return; }
    if (!S.med && e.key === "ArrowLeft"){ e.preventDefault(); S.affI = Math.max(0, S.affI - 1); paintAff(); return; }
  }
  if (e.key === "Escape" && $("sheet").classList.contains("open")){ closeSheet(); return; }
  const t = e.target;
  if (e.key === "Enter" && t.dataset && t.dataset.f){ e.preventDefault(); t.blur(); return; }
  if (e.key === "Enter" && t.dataset && t.dataset.log){ t.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && t.classList && t.classList.contains("ccol") && t.dataset.open){ e.preventDefault(); openDay(t.dataset.open); return; }
  if (e.key === "Enter" && t.id === "coachIn" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches){ e.preventDefault(); ask(t.value); return; }
  if (e.key === "Enter" && t.id === "qW"){ e.preventDefault(); const b = document.querySelector('[data-act="qWeight"]'); if (b) b.click(); }
});
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.keep) S.keep[d.dataset.keep] = d.open; }, true);

/* ---------- info-bulles des graphiques ---------- */
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el) showTip(el, e.clientX, e.clientY); else tipEl().classList.remove("on");
});
document.addEventListener("pointerdown", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (el && e.pointerType !== "mouse"){ hideTip(); showTip(el, e.clientX, e.clientY); const hv = el.nextElementSibling; if (hv && hv.classList.contains("hv")) hv.classList.add("on"); }
  else if (!el) hideTip();
});
window.addEventListener("scroll", () => tipEl().classList.remove("on"), {passive:true});
let rT;
window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { $("view").classList.remove("enter"); updateChrome(); drawCharts($("view")); }, 150); });

/* ---------- horloge ---------- */
function tick(){
  if (document.visibilityState !== "visible" || $("overlay").firstChild || S.coachBusy) return;
  if (isEditing()){ renderBanner(); return; }
  if (S.view === "today" || (S.view === "plan" && S.sub.plan === "week")) render(); else { updateChrome(); renderBanner(); }
}
function boardTick(){
  if (document.visibilityState !== "visible" || REDUCED() || $("overlay").firstChild) return;
  if (S.view === "mind" && (S.sub.mind || "phr") === "aff"){ S.boardI++; paintBoard(); }
}
/* liens directs : …#sans-filtre, #aujourdhui, #planning… (pour une icône du Dock par section) */
const HASHV = {"qg":"today", "aujourdhui":"today", "agenda":"plan", "planning":"plan", "missions":"tasks", "taches":"tasks", "trophees":"game", "progression":"prog", "avancement":"prog", "prospection":"biz", "business":"biz", "contenu":"content", "cash":"money", "argent":"money", "dashboard":"dash",
  "din":"din", "corps":"body", "mental":"mind", "journal":"journal", "physique":"body", "mindset":"mind", "sans-filtre":"mind", "competences":"skills", "livres":"books", "vision":"vision", "objectifs":"vision", "passions":"passions", "coach":"coach", "reglages":"settings"};
function hashView(){ try { return HASHV[decodeURIComponent((location.hash || "").slice(1)).toLowerCase()] || null; } catch(e){ return null; } }
window.addEventListener("hashchange", () => { const v = hashView(); if (v && v !== S.view) go(v); });

/* ---------- démarrage ---------- */
S.keep = {};
buildChrome(); applyTheme(theme);
(() => {
  const {r, legacy} = lsLoad(); S.store = r; S.legacy = legacy;
  legacy.forEach(({id, data}) => { if (/^[dw]-\d{4}-\d{2}-\d{2}$/.test(id) && !S.store[id]) S.store[id] = id[0] === "d" ? norm(clone(data)) : {mOk:0, ...clone(data)}; });
})();
{
  const t0 = logicalToday(), h0 = new Date().getHours(), st0 = prepState(addDays(t0, 1));
  S.weekOf = mondayOf(t0); S.dayKey = addDays(t0, 1);
  if ((h0 >= 20 || h0 < 4) && st0 !== "ok" && st0 !== "lateok"){ S.view = "plan"; S.sub.plan = "day"; }
  const hv = hashView(); if (hv) S.view = hv;
}
loadNotifs();
S.loading = !!(window.claude && window.claude.use);
setSync("local"); render();
initDb();
getSample().then(() => { if (S.view === "coach" && !S.coachBusy) render(); });
setInterval(tick, 30000); setInterval(boardTick, 6500);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(theme)); } catch(e){}

})();
</script>
