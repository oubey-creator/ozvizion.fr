/* 30.04.2027 · v3 — le QG d'Oubey.
   DA : blanc aéré, noir franc, vert-jaune fluo (#D4FF3A) pour l'action, jaune fluo pour les récompenses.
   Thème sombre : noir profond + néon. Typo : Archivo étendu (titres, chiffres), Geist (texte), Geist Mono (données). */
:root{
  --bg:#FFFFFF; --bg2:#F7F8F3; --s1:#F5F6F0; --s2:#FFFFFF; --s3:#E9ECE2; --line:#ECEEE6; --line2:#D9DDD0;
  --fg:#0B0C0A; --fg2:#24271F; --mut:#5C6156; --mut2:#9AA092;
  --acc:#D4FF3A; --acc-ink:#4A6300; --acc-s:rgba(212,255,58,.28); --acc-l:rgba(212,255,58,.55); --on-acc:#0B0C0A; --band:#D4FF3A;
  --gold:#FFE14D; --gold-ink:#7A5F00; --neon:#22E57A;
  --bad:#FF2E55; --bad-s:rgba(255,46,85,.09); --ok:#10A957; --ok-s:rgba(16,169,87,.1);
  --f-biz:#A8D600; --f-mer:#3D7BFF; --f-cont:#FF3DA8; --f-corps:#00B8F0; --f-din:#14B871; --f-vie:#A3A89B;
  --ink:#0B0C0A; --ink-fg:#F4F7EC;
  --shadow:0 1px 2px rgba(11,12,10,.04), 0 18px 40px -24px rgba(11,12,10,.22);
  --glow:rgba(212,255,58,.22);
  --disp:"Archivo","Arial Black",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:var(--disp);
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ar:"Noto Naskh Arabic","Geeza Pro","Arial",serif;
  --pph:46px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#050605; --bg2:#0A0C09; --s1:#101210; --s2:#161915; --s3:#1F231E; --line:#1C201B; --line2:#2C3229;
  --fg:#F4F7EC; --fg2:#DCE2D2; --mut:#9AA391; --mut2:#5D6658;
  --acc:#D4FF3A; --acc-ink:#D4FF3A; --acc-s:rgba(212,255,58,.12); --acc-l:rgba(212,255,58,.35); --on-acc:#0B0C0A; --band:#D4FF3A;
  --gold:#FFE14D; --gold-ink:#FFE14D; --neon:#2BFF8E;
  --bad:#FF4D6D; --bad-s:rgba(255,77,109,.13); --ok:#2BE584; --ok-s:rgba(43,229,132,.12);
  --f-biz:#D4FF3A; --f-mer:#6E9BFF; --f-cont:#FF5CB8; --f-corps:#3AD3FF; --f-din:#2BE584; --f-vie:#8E9786;
  --ink:#D4FF3A; --ink-fg:#0B0C0A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9);
  --glow:rgba(212,255,58,.06);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#050605; --bg2:#0A0C09; --s1:#101210; --s2:#161915; --s3:#1F231E; --line:#1C201B; --line2:#2C3229;
  --fg:#F4F7EC; --fg2:#DCE2D2; --mut:#9AA391; --mut2:#5D6658;
  --acc:#D4FF3A; --acc-ink:#D4FF3A; --acc-s:rgba(212,255,58,.12); --acc-l:rgba(212,255,58,.35); --on-acc:#0B0C0A; --band:#D4FF3A;
  --gold:#FFE14D; --gold-ink:#FFE14D; --neon:#2BFF8E;
  --bad:#FF4D6D; --bad-s:rgba(255,77,109,.13); --ok:#2BE584; --ok-s:rgba(43,229,132,.12);
  --f-biz:#D4FF3A; --f-mer:#6E9BFF; --f-cont:#FF5CB8; --f-corps:#3AD3FF; --f-din:#2BE584; --f-vie:#8E9786;
  --ink:#D4FF3A; --ink-fg:#0B0C0A;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 18px 40px -22px rgba(0,0,0,.9);
  --glow:rgba(212,255,58,.06);
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 14px/1.5 var(--body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 30vmax at 82% 8%, var(--glow), transparent 70%), radial-gradient(30vmax 26vmax at 6% 92%, var(--glow), transparent 70%)}
@media (prefers-reduced-motion: no-preference){ body::before{animation:drift 26s ease-in-out infinite alternate} }
@keyframes drift{to{transform:translate3d(-4vmax,3vmax,0) scale(1.08)}}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
a{color:inherit}
::selection{background:var(--acc-l)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.k{font:700 10px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.k.acc{color:var(--acc)}
.mut{color:var(--mut)}
.small{font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- squelette ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding-block:22px 16px;padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:14px;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
.brand{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.logo{font:800 30px/1 var(--disp);letter-spacing:-.045em;white-space:nowrap}
.logo i{font-style:normal;color:var(--acc)}
.cd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.cd b{font:800 17px/1 var(--disp);color:var(--fg);letter-spacing:-.02em}
.track{height:3px;border-radius:3px;background:var(--s3);overflow:hidden}
.track i{display:block;height:100%;background:var(--acc);border-radius:inherit}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav .hl{position:absolute;left:0;right:0;top:0;height:40px;border-radius:999px;background:var(--s1);box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.nav .hl::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--acc-s)}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;border-radius:999px;color:var(--mut);font-weight:600;font-size:13.5px;transition:color .2s}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{padding-left:24px}
.nav .badge{margin-left:auto;font:700 10px/1 var(--body);color:var(--on-acc);background:var(--acc);border-radius:99px;padding:4px 6px}
.nav .badge.bad{background:var(--bad);color:#fff}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.sync{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut);padding:0 8px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut2);flex:none}
.sync.on i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-s)}
.railbtns{display:flex;gap:6px}
.railbtns .btn{flex:1}

main.main{min-width:0;padding-block:26px 70px;padding-left:max(30px, env(safe-area-inset-left, 0px));padding-right:max(30px, env(safe-area-inset-right, 0px))}
.page{max-width:1260px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
#banner:empty{display:none}
.mtop{display:none}
.tabbar{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main.main{padding-block:10px calc(96px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 2px}
  .mtop .logo{font-size:22px}
  .mtop .l{display:flex;align-items:baseline;gap:10px}
  .mtop .r{display:flex;align-items:center;gap:8px}
  .chipj{font:800 14px/1 var(--disp);letter-spacing:-.01em;background:var(--s1);border:1px solid var(--line);border-radius:99px;padding:7px 11px 6px}
  .tabbar{display:flex;position:fixed;z-index:60;left:0;right:0;bottom:0;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
    background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
  .tabbar .tind{position:absolute;top:7px;height:50px;width:calc((100% - 20px) / 5);left:10px;border-radius:14px;background:var(--s1);border:1px solid var(--line);transform:translateX(calc(var(--i,0) * 100%));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .tabbar button{position:relative;z-index:1;flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--mut);transition:color .2s}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar svg{width:21px;height:21px}
}

/* feuille "Plus" (téléphone) */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .pan{width:100%;max-width:560px;background:var(--s1);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:12px}
.sheet.open .pan{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line2);align-self:center}
.sheet .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:18px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:12.5px}
.sheet .grid svg{width:22px;height:22px}

/* ---------- éléments ---------- */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 18px}
.ttl{font:800 40px/1.04 var(--disp);letter-spacing:-.045em;margin:4px 0 0;text-wrap:balance}
.ttl .acc{color:var(--acc-ink)}
.ttl em,.mark{-webkit-box-decoration-break:clone;box-decoration-break:clone;font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;padding:0 .08em;background-image:linear-gradient(var(--band),var(--band));background-repeat:no-repeat;background-position:0 88%;background-size:100% 36%}
.enter .ttl em,.enter .mark{animation:mark 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes mark{from{background-size:0% 36%}}
.oz{display:inline-flex;align-items:baseline;gap:8px;color:var(--fg);white-space:nowrap}
.oz i{font:italic 400 30px/1 var(--serif);padding:0 3px;background:linear-gradient(transparent 62%,var(--acc) 62%)}
.oz b{font:800 11.5px/1 var(--body);letter-spacing:.26em}
.oz.sm i{font-size:24px}
.vh-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
@media (max-width:899px){ .ttl{font-size:31px} }
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.flat{box-shadow:none}
.card.inset{background:var(--s2);box-shadow:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.h{font:800 18px/1.15 var(--disp);letter-spacing:-.025em;margin:0;text-wrap:balance}
.h.sm{font-size:16px}
.h .mut{font-weight:700}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:760px){ .g2,.g3{grid-template-columns:minmax(0,1fr)} }
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;transition:background .15s, transform .12s, border-color .15s}
.btn:hover{background:var(--s3)}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--fg);color:var(--bg);border-color:transparent}
.btn.pri:hover{opacity:.9}
.btn.acc{background:var(--acc);color:var(--on-acc);border-color:transparent}
.btn.acc:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.out{background:transparent;border:1.5px solid var(--fg);color:var(--fg)}
.btn.ghost:hover{background:var(--s2)}
.btn.bad{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{height:32px;padding:0 12px;border-radius:999px;font-size:12px}
.btn.lg{height:50px;padding:0 22px;border-radius:999px;font-size:15px}
.btn.wide{width:100%}
.ib{width:34px;height:34px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--line);flex:none;transition:background .15s, transform .12s, color .15s}
.ib:hover{background:var(--s3)}
.ib:active{transform:scale(.92)}
.ib svg{width:16px;height:16px}
.ib.sm{width:28px;height:28px;border-radius:999px}
.ib.sm svg{width:14px;height:14px}
.ib.bare{background:transparent;border-color:transparent}
.ib.del:hover{color:var(--bad);background:var(--bad-s)}
.in{height:40px;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:0 12px;font-weight:500;color:var(--fg);transition:border-color .15s, background .15s}
.in:focus{outline:none;border-color:var(--acc);background:var(--s1)}
.in::placeholder{color:var(--mut2)}
textarea.in{height:auto;min-height:74px;padding:10px 12px;resize:vertical;line-height:1.45}
select.in{padding-right:28px;cursor:pointer}
.in.grow{flex:1}
.in.num{width:86px;text-align:center;font-weight:700}
.form{display:flex;flex-wrap:wrap;gap:8px}
.form .in{flex:1 1 160px}
.seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{height:34px;padding:0 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap;transition:color .2s, background .2s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--s2);color:var(--mut)}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.bad{background:var(--bad-s);color:var(--bad)}
.pill.acc{background:var(--acc-s);color:var(--acc-ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fc,var(--mut));flex:none;display:inline-block}
.bar{height:6px;border-radius:99px;background:var(--s3);overflow:hidden;flex:none}
.bar>i{display:block;height:100%;width:var(--w,0%);border-radius:inherit;background:var(--bc,var(--acc))}
.bar.thick{height:10px}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.note{border-radius:12px;padding:11px 14px;background:var(--acc-s);font-size:13px;color:var(--fg2)}
.note b{color:var(--acc-ink)}
.warn{border-radius:12px;padding:11px 14px;background:var(--bad-s);color:var(--bad);font-weight:600;font-size:13px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hr{height:1px;background:var(--line);border:0;margin:0}
.big{font:800 46px/.95 var(--disp);letter-spacing:-.05em}
.big.md{font-size:38px}
.big.sm{font-size:28px}
.stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .v{font:800 28px/1 var(--disp);letter-spacing:-.04em}
.stat .v small{font:700 13px var(--body);color:var(--mut);margin-left:3px;letter-spacing:0}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.acc{color:var(--acc-ink);background:var(--acc-s);border-color:transparent}
.tag.bad{color:var(--bad);background:var(--bad-s);border-color:transparent}
.tag.ok{color:var(--ok);background:var(--ok-s);border-color:transparent}

/* case à cocher animée */
.cbx{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.cbx input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.cbx .box{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--s1);transition:background .2s, border-color .2s}
.cbx .box svg{width:13px;height:13px;overflow:visible}
.cbx .box path{fill:none;stroke:var(--on-acc);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22}
.cbx input:checked + .box{background:var(--acc);border-color:var(--acc)}
.cbx input:checked + .box path{stroke-dashoffset:0}
.cbx input:focus-visible + .box{outline:2px solid var(--acc);outline-offset:2px}
.cbx.just input:checked + .box{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.cbx.just input:checked + .box path{animation:draw .38s ease .06s both}
.cbx .t{min-width:0;overflow-wrap:anywhere}
.cbx input:checked ~ .t.strike{text-decoration:line-through;color:var(--mut)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}

/* animations d'entrée (uniquement quand on change de page) */
.enter .rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms)}
.enter .bar>i{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 60ms + 180ms)}
.enter .chart .mk{animation:rise .5s ease both;animation-delay:calc(var(--j,0) * 22ms + 200ms)}
.enter .chart .bk{transform-box:fill-box;transform-origin:bottom;animation:barup .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0) * 28ms + 150ms)}
.enter .chart .ln{stroke-dasharray:3000;stroke-dashoffset:3000;animation:line 1.6s cubic-bezier(.4,0,.2,1) .15s forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(5px)}}
@keyframes grow{from{width:0}}
@keyframes barup{from{transform:scaleY(0)}}
@keyframes line{to{stroke-dashoffset:0}}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--acc-l)}40%{box-shadow:0 0 0 6px var(--acc-s)}100%{box-shadow:0 0 0 0 transparent}}

/* ---------- AUJOURD'HUI ---------- */
.tgrid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(320px,1fr);gap:18px;align-items:start}
.tcol{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1060px){ .tgrid{display:flex;flex-direction:column} .tcol{display:contents} .tgrid > .tcol > *{order:var(--o,50)} }
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 28px;align-items:end;padding:22px}
.hero .jbig{font:800 clamp(66px,8.6vw,116px)/.9 var(--disp);letter-spacing:-.06em;margin:6px 0 0;
  background:linear-gradient(100deg,var(--fg) 0 38%,var(--acc) 50%,var(--fg) 62% 100%);background-size:280% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion: no-preference){ .hero .jbig{animation:shine 7s ease-in-out infinite} }
@keyframes shine{0%,55%{background-position:100% 0}100%{background-position:0 0}}
.hero .jsub{font-size:13px;color:var(--mut);margin-top:8px}
.hero .jsub b{color:var(--fg)}
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0;text-align:left;transition:border-color .2s, transform .15s}
.mini:hover{border-color:var(--line2)}
.mini:active{transform:scale(.98)}
.mini .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.mini .v{font:800 18px/1 var(--disp);letter-spacing:-.03em;white-space:nowrap}
.mini .v small{font-size:13px;color:var(--mut)}
.days180{grid-column:1 / -1;display:flex;gap:2px;height:16px;align-items:stretch}
.days180 i{flex:1;border-radius:2px;background:var(--s3);min-width:1px}
.days180 i.p{background:var(--acc-l)}
.days180 i.g{background:var(--acc)}
.days180 i.t{background:var(--fg);animation:blink 1.6s ease-in-out infinite}
.days180 i.m{margin-left:4px}
@keyframes blink{50%{opacity:.35}}
@media (max-width:640px){ .hero{grid-template-columns:minmax(0,1fr);padding:18px} .days180{height:12px;gap:1px} .days180 i.m{margin-left:2px} }

.now{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;padding:22px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.now::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;z-index:-1;
  background:conic-gradient(from var(--ang,0deg),transparent 0 62%,var(--fc,var(--acc)) 78%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.now::after{content:"";position:absolute;z-index:-2;width:340px;height:340px;right:-120px;top:-170px;border-radius:50%;background:var(--fc,var(--acc));opacity:.10;filter:blur(40px)}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@media (prefers-reduced-motion: no-preference){ .now::before{animation:spin 5s linear infinite} }
@keyframes spin{to{--ang:360deg}}
.now .t{font:800 clamp(30px,4.2vw,48px)/1.02 var(--disp);letter-spacing:-.045em;overflow-wrap:anywhere;text-wrap:balance}
.now .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:13px;color:var(--mut)}
.now .left{font:400 27px/1 var(--serif);font-style:italic;color:var(--fg)}
.now .subs{display:flex;flex-wrap:wrap;gap:6px}
.now .subs .cbx{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 7px;font-size:12.5px;font-weight:600}
.now .subs .cbx .box{width:18px;height:18px;border-radius:6px}
.now .subs .cbx .box svg{width:11px;height:11px}
.now .acts{display:flex;flex-wrap:wrap;gap:8px}
.now.idle{background:var(--s1)}
.now.bad{border-color:var(--bad)}
.now.bad::before{display:none}
.now.bad .t{color:var(--bad)}
.hatch{background-image:repeating-linear-gradient(135deg,var(--bad-s) 0 10px,transparent 10px 20px)}

.qs{display:flex;flex-direction:column;gap:2px}
.q{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--acc-s);color:var(--acc-ink)}
.q .ic.bad{background:var(--bad-s);color:var(--bad)}
.q .ic svg{width:15px;height:15px}
.q .qt{font-weight:700;font-size:13.5px;align-self:center}
.q .qa{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.q .qa .in{height:32px;width:96px;border-radius:9px}

.reqs{display:flex;flex-wrap:wrap;gap:7px}
.req{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:7px 11px 7px 8px;font-size:12.5px;font-weight:600;transition:background .2s, border-color .2s}
.req .box{width:19px;height:19px;border-radius:6px}
.req .box svg{width:11px;height:11px}
.req:has(input:checked){background:var(--acc-s);border-color:transparent}

/* compteurs d'appels */
.ctr{display:flex;flex-direction:column;gap:10px}
.ctr + .ctr{border-top:1px solid var(--line);padding-top:14px}
.ctr .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px}
.taps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tap{position:relative;overflow:hidden;height:62px;border-radius:18px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:11.5px;color:var(--mut);transition:transform .1s, background .15s}
.tap b{font:800 22px/1 var(--disp);color:var(--fg);letter-spacing:-.03em}
.tap:active{transform:scale(.95)}
.tap.go{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.tap.go b{color:var(--on-acc)}
.tap.just b{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.tap.just{animation:tapflash .5s ease}
@keyframes tapflash{0%{box-shadow:0 0 0 0 var(--acc-l)}100%{box-shadow:0 0 0 10px transparent}}
.ib.confirm,.btn.confirm{width:auto;padding:0 9px;background:var(--bad);border-color:transparent;color:#fff;font-size:11.5px;font-weight:800}
.tap .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.rates{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}
.rates b{color:var(--fg);font-weight:800}
.fix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.fix div{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--s2);border-radius:10px;padding:4px;font-size:11px;color:var(--mut);font-weight:600}
.fix div span{flex:1;text-align:center}

/* programme */
.prog{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:4px 92px minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 4px 10px 0;border-bottom:1px solid var(--line);border-radius:4px}
.pr:last-child{border-bottom:0}
.pr .fb{align-self:stretch;border-radius:4px;background:var(--fc)}
.pr .tm{font:500 11px/1.2 var(--mono);color:var(--mut)}
.pr .tt{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pr .tt small{display:block;font-weight:600;font-size:11.5px;color:var(--mut)}
.pr.cur{background:linear-gradient(90deg,var(--acc-s),transparent)}
.pr.cur .tm{color:var(--acc-ink)}
.pr.done .tt{color:var(--mut);text-decoration:line-through}
.pr .late{margin-left:6px;font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--bad);text-transform:uppercase}
.pr .ps{grid-column:3 / -1;display:flex;flex-wrap:wrap;gap:4px 12px}
.pr .ps .cbx{font-size:12px;color:var(--mut);gap:6px}
.pr .ps .box{width:16px;height:16px;border-radius:5px}
.pr .ps .box svg{width:10px;height:10px}
@media (max-width:600px){ .pr{grid-template-columns:4px 64px minmax(0,1fr) auto;gap:6px 9px} .pr .tm{font-size:9.5px} }
.yn{display:flex;gap:5px}
.yn button{width:34px;height:32px;border-radius:9px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;color:var(--mut);transition:background .15s, color .15s, transform .1s}
.yn button svg{width:15px;height:15px}
.yn button:active{transform:scale(.9)}
.yn button.y[aria-pressed="true"]{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:transparent;color:#fff}
.yn button.just{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}

.todo{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.todo:last-of-type{border-bottom:0}
.todo .cbx{flex:1}
.goal{display:flex;align-items:center;gap:10px}
.goal .n{font:400 27px/1 var(--serif);font-style:italic;color:var(--acc-ink);width:16px;text-align:center;flex:none}
.scores{display:flex;flex-wrap:wrap;gap:16px 30px}

/* ---------- PLANNING ---------- */
.calwrap{overflow-x:auto;border-radius:18px;background:var(--s1);border:1px solid var(--line);padding:14px 14px 8px;box-shadow:var(--shadow);scroll-snap-type:x proximity;scrollbar-width:thin}
.cal{display:grid;grid-template-columns:40px repeat(7,minmax(124px,1fr));column-gap:8px;min-width:940px}
.chd{display:flex;flex-direction:column;gap:2px;padding:0 2px 10px;scroll-snap-align:start}
.chd .dn{font:800 14px/1.1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.chd .dd{font-size:11px;color:var(--mut);font-weight:600}
.chd.today .dn{color:var(--acc)}
.chd .pill{align-self:flex-start;margin-top:4px;padding:2px 8px;font-size:10.5px}
.axis{position:relative;height:calc(var(--pph) * var(--hours,16))}
.axis span{position:absolute;right:6px;transform:translateY(-50%);font:500 9.5px var(--mono);color:var(--mut)}
.ccol{position:relative;height:calc(var(--pph) * var(--hours,16));border-radius:12px;background:var(--s2);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--pph))}
.ccol.click{cursor:pointer;transition:box-shadow .2s}
.ccol.click:hover{box-shadow:0 0 0 2px var(--line2)}
.ccol.tmr{box-shadow:0 0 0 2px var(--acc)}
.cb{position:absolute;left:4px;right:4px;border-radius:7px;padding:3px 7px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:0;
  background:var(--s1);background:color-mix(in srgb,var(--fc) 15%,var(--s1));border-left:3px solid var(--fc)}
.cb .ct{font-weight:800;font-size:11.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb.tall .ct{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cb.xs{padding:0 6px}
.cb.xs .ct{font-size:10px;line-height:1.05}
.cb .chh{font:500 9px/1.2 var(--mono);color:var(--mut);white-space:nowrap}
.cb ol{margin:3px 0 0;padding:0;list-style:none;display:flex;flex-direction:column}
.cb ol li{font-size:9px;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg2)}
.cb ol li b{font-weight:600;color:var(--mut);margin-right:4px}
.cb.subs{justify-content:flex-start;padding-top:5px}
.cb.done::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--fc)}
.cb.miss{opacity:.5;background-image:repeating-linear-gradient(135deg,var(--bad-s) 0 6px,transparent 6px 12px)}
.cb.past{opacity:.55}
.enter .cb{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--j,0) * 14ms + 100ms)}
.cst{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:12px;font-size:12px;color:var(--mut);font-weight:600}
.cst .sh{font:800 14px/1.1 var(--disp);text-transform:uppercase;letter-spacing:.02em;color:var(--fg)}
.cst.late{background-image:repeating-linear-gradient(135deg,var(--bad-s) 0 10px,transparent 10px 20px)}
.cst.late .sh{color:var(--bad)}
.cst.tonight .sh{color:var(--acc)}
.cnow{position:absolute;left:-3px;right:0;height:0;border-top:2px solid var(--bad);z-index:3}
.cnow::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.cft{font-size:11px;color:var(--mut);padding:8px 2px 2px;display:flex;flex-direction:column;gap:1px}
.cft b{color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--fc)}

.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
@media (max-width:960px){ .dgrid{grid-template-columns:minmax(0,1fr)} .dgrid .side{display:none} }
.side{position:sticky;top:16px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.ruler{position:relative;height:calc(var(--pph) * var(--hours,16) * .78)}
.ruler .hrl{position:absolute;left:0;width:100%;border-top:1px solid var(--line)}
.ruler .hrl span{position:absolute;left:0;top:-7px;font:500 9px var(--mono);color:var(--mut);background:var(--s1);padding-right:4px}
.ruler .rb{position:absolute;left:30px;right:0;border-radius:4px;overflow:hidden;padding:0 6px;display:flex;align-items:center;font-size:10px;font-weight:700;white-space:nowrap;background:var(--s2);background:color-mix(in srgb,var(--fc) 18%,var(--s1));border-left:2px solid var(--fc)}
.blist{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.blk{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:6px 12px;padding:11px 12px 11px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .fb{grid-row:1 / span 4;background:var(--fc);border-radius:0 3px 3px 0}
.blk .main{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.tin{width:64px;height:34px;text-align:center;font-weight:800;font-size:13.5px;border-radius:9px;border:1px solid var(--line);background:var(--s2);font-variant-numeric:tabular-nums}
.tin:focus{outline:none;border-color:var(--acc)}
.blk .end{font:500 11px var(--mono);color:var(--mut);white-space:nowrap}
.fixe{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--acc-s);color:var(--acc-ink)}
.blk .title{flex:1 1 170px;min-width:0;height:34px;border:0;background:transparent;font-weight:700;font-size:14.5px;padding:0 6px;border-radius:8px}
.blk .title:hover,.blk .title:focus{background:var(--s2);outline:none}
.blk .ctl{display:flex;align-items:center;gap:4px}
.blk .ctl .d{min-width:54px;text-align:center;font-weight:800;font-size:13px}
.blk .ext{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lnk{font-size:12px;font-weight:700;color:var(--mut);padding:5px 10px;border-radius:999px;background:var(--s2)}
.lnk:hover{color:var(--fg)}
.blk .subs{grid-column:2 / -1;display:flex;flex-direction:column;gap:6px;background:var(--s2);border-radius:12px;padding:10px 12px}
.blk .subs .sr2{display:flex;align-items:center;gap:8px;font-size:13px}
.blk .subs .sr2 .n{font:500 10px var(--mono);color:var(--mut);min-width:16px}
.blk .subs .sr2 .t{flex:1;min-width:0}
.prob{grid-column:2 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bad-s);color:var(--bad);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700}
.free{padding:6px 14px 6px 18px;font:500 10.5px var(--mono);color:var(--mut);background:var(--s2);border-bottom:1px solid var(--line)}
@media (max-width:600px){ .blk .ctl{grid-column:2 / -1;justify-content:flex-end} }
.adds{display:flex;flex-direction:column;gap:12px}
.adds .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.adds .grp .k{width:100%;margin-bottom:-2px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;font-weight:700;transition:border-color .15s, transform .1s}
.chip:hover{border-color:var(--fg)}
.chip:active{transform:scale(.95)}
.chip.dash{border-style:dashed;color:var(--mut)}
.chip svg{width:14px;height:14px;flex:none}
.chip[disabled]{opacity:.45;cursor:default}
.chip .x{margin-left:2px;color:var(--mut);font-size:14px;line-height:1}
.chip .x:hover{color:var(--bad)}
.undo{display:flex;align-items:center;gap:12px;font-size:13px;background:var(--acc-s);border-radius:12px;padding:9px 14px;font-weight:600}
.undo button{font-weight:800;color:var(--acc-ink)}
.validate{width:100%;height:58px;border-radius:999px;font:800 18px/1 var(--disp);letter-spacing:-.01em;background:var(--fg);color:var(--bg);transition:transform .12s, background .2s}
.validate:active{transform:scale(.985)}
.validate.ok{background:var(--acc);color:var(--on-acc)}
.emptyday{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:30px 18px}

/* ---------- TÂCHES / LISTES ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .cbx{flex:1;min-width:0}
.li .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.li .acts{display:flex;gap:4px;flex:none}
.li.star .t{font-weight:800}
.star-ic{color:var(--acc)}
.fl{display:flex;flex-wrap:wrap;gap:6px}
.fl button{height:30px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.fl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.one{position:relative;overflow:hidden}
.one .in{height:48px;font-size:16px;font-weight:700;background:var(--s1)}
.togstar{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:12.5px;color:var(--mut)}
.togstar[aria-pressed="true"]{background:var(--acc-s);color:var(--acc-ink);border-color:transparent}
.togstar svg{width:15px;height:15px}

/* ---------- BUSINESS ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.kpi .v{font:800 26px/1 var(--disp);letter-spacing:-.04em}
.kpi .l{font-size:11.5px;color:var(--mut);font-weight:600;margin-top:4px}
.kpi .v.acc{color:var(--acc)}
.kan{display:grid;grid-template-columns:repeat(5,minmax(176px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.kc{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;scroll-snap-align:start}
.kc .kh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px}
.kc .kh b{font:800 12.5px/1 var(--disp);text-transform:uppercase;letter-spacing:.08em}
.kit{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:7px;font-weight:700;font-size:13px}
.kit .kb{display:flex;align-items:center;gap:4px}
.kit.slide{animation:slidein .5s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateX(-18px) scale(.96)}}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .nm{font-weight:800}
.cl .why{grid-column:1;font-size:12.5px;color:var(--mut)}
.cl .acts{grid-row:1 / span 2;grid-column:2;display:flex;gap:5px;align-items:center}
.cl.late .nm{color:var(--bad)}
.notes .nt{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.notes .nt:last-child{border-bottom:0}
.notes .nt p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tips{display:flex;flex-direction:column;gap:2px}
.tips .cbx{padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tips .cbx:last-child{border-bottom:0}
.tips .cbx .t b{display:block}
.tips .cbx .t span{font-size:12.5px;color:var(--mut);font-weight:500}

/* ---------- graphiques ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font:500 9.5px var(--mono);fill:var(--mut)}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover + .hv, .chart .hv.on{opacity:1}
.chart .hv{opacity:0;fill:var(--fg);fill-opacity:.05;pointer-events:none;transition:opacity .12s}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{stroke:var(--s1);stroke-width:2}
.chart .ref{stroke:var(--mut2);stroke-width:1;stroke-dasharray:4 4}
.chart .reft{font:500 9.5px var(--mono);fill:var(--mut)}
.lgd{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;font-weight:600;color:var(--mut)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px;background:var(--fc)}
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;line-height:1.4;padding:7px 10px;border-radius:9px;opacity:0;transform:translateY(4px);transition:opacity .12s, transform .12s;max-width:240px}
#tip.on{opacity:1;transform:none}
#tip div:first-child{font-weight:800}

/* ---------- CORPS / JEÛNE ---------- */
.fast{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:5px;max-width:760px}
@media (max-width:640px){ .fast{grid-template-columns:repeat(10,minmax(0,1fr))} }
.fast button{aspect-ratio:1;border-radius:7px;background:var(--s2);border:1px solid var(--line);font:600 9px var(--mono);color:var(--mut2);display:grid;place-items:center;transition:transform .12s}
.fast button:active{transform:scale(.9)}
.fast button.y{background:var(--acc);border-color:transparent;color:var(--on-acc)}
.fast button.n{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.fast button.t{box-shadow:0 0 0 2px var(--fg)}
.fast button.f{opacity:.55;cursor:default}
.enter .fast button{animation:rise .4s ease both;animation-delay:calc(var(--j,0) * 12ms + 150ms)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .v{min-width:74px;text-align:center;font:800 20px/1 var(--disp);letter-spacing:-.03em}

/* ---------- MINDSET ---------- */
.board{position:relative;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;background:var(--fg);color:var(--bg);border:0}
.board .k{color:var(--bg);opacity:.6}
.board .ph{font:400 clamp(36px,4.8vw,62px)/1 var(--serif);font-style:italic;letter-spacing:-.01em;min-height:2em;text-wrap:balance}
.board .ph.swap{animation:swap .6s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
.board .dots{display:flex;gap:5px;flex-wrap:wrap}
.board .dots i{width:16px;height:3px;border-radius:3px;background:var(--bg);opacity:.25;transition:opacity .3s, width .3s}
.board .dots i.on{opacity:1;width:28px}
.board .btn{background:transparent;border-color:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.board::after{content:"";position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:var(--acc);opacity:.22;filter:blur(30px)}
.affl{columns:2 280px;column-gap:24px;margin:0;padding:0;list-style:none;counter-reset:a}
.affl li{break-inside:avoid;display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px}
.affl li::before{counter-increment:a;content:counter(a);font:500 9.5px var(--mono);color:var(--mut);min-width:22px}
.affl li span{flex:1;min-width:0}
.book{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.book:last-child{border-bottom:0}
.book .bt{font-weight:800}
.book .bt small{font-weight:600;color:var(--mut);margin-left:6px}
.book .bar{grid-column:1 / -1}
.book .bc{display:flex;align-items:center;gap:6px}
.book .bc .in{width:72px;height:32px;text-align:center;font-weight:800}

/* plein écran : lecture des affirmations / méditation */
.over{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:28px max(20px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));text-align:center;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}}
.over .x{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right))}
.over .aff{font:800 clamp(32px,6vw,74px)/1.03 var(--disp);letter-spacing:-.045em;max-width:1000px;text-wrap:balance}
.over .aff.swap{animation:swap .55s cubic-bezier(.2,.8,.2,1)}
.over .prog2{width:min(520px,80vw);height:3px;background:var(--s3);border-radius:3px;overflow:hidden}
.over .prog2 i{display:block;height:100%;background:var(--acc);transition:width .4s}
.breath{width:min(300px,62vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative}
.breath::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--acc-l),transparent 70%);transform:scale(.55);transition:transform 4s cubic-bezier(.4,0,.2,1)}
.breath.inh::before{transform:scale(1)}
.breath.exh::before{transition-duration:6s}
.breath::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1.5px solid var(--acc-l)}
.breath b{position:relative;font:800 15px var(--disp);text-transform:uppercase;letter-spacing:.14em}
.medq{font-size:17px;font-weight:600;max-width:560px;min-height:3em;color:var(--fg2)}
.medq.swap{animation:swap .8s ease}

/* ---------- OBJECTIFS ---------- */
.goalc{display:flex;flex-direction:column;gap:12px}
.goalc .gv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goalc .gv .big{font-size:48px}
.goalc .gv .of{font-weight:700;color:var(--mut)}
.heat{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:4px;max-width:820px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--s3);display:block}
.heat i.f{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:var(--acc);opacity:.28}
.heat i.l2{background:var(--acc);opacity:.52}
.heat i.l3{background:var(--acc);opacity:.76}
.heat i.l4{background:var(--acc)}
.heat i.t{box-shadow:0 0 0 2px var(--fg)}
.enter .heat i{animation:rise .35s ease both;animation-delay:calc(var(--j,0) * 4ms + 120ms)}
@media (max-width:640px){ .heat{grid-template-columns:repeat(15,minmax(0,1fr))} }
.pil{display:flex;flex-direction:column;gap:10px}
.pil .n{font:400 52px/.8 var(--serif);font-style:italic;color:var(--acc-ink)}

/* ---------- COACH ---------- */
.coach{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:980px){ .coach{grid-template-columns:minmax(0,1fr)} }
.chat{display:flex;flex-direction:column;gap:14px;min-height:46vh}
.msg{max-width:88%;padding:13px 16px;border-radius:20px;font-size:14px;line-height:1.55;overflow-wrap:anywhere;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--s1);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.a b{color:var(--acc-ink)}
.msg ul,.msg ol{margin:6px 0;padding-left:20px}
.msg p{margin:0 0 8px}
.msg p:last-child{margin:0}
.msg .toolnote svg{width:14px;height:14px;flex:none}
.msg .toolnote{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-s);border-radius:8px;padding:4px 9px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:typ 1.2s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.composer{position:sticky;bottom:12px;display:flex;gap:8px;align-items:flex-end;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:40px;max-height:160px;padding:9px 8px;font-weight:500;color:var(--fg)}
.composer textarea:focus{outline:none}
@media (max-width:899px){ .composer{bottom:calc(84px + env(safe-area-inset-bottom))} }
.prompts{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- SANS FILTRE ---------- */
.truths{display:flex;flex-direction:column;gap:10px}
.tr{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(130px,auto) minmax(0,1fr) auto;align-items:center;gap:8px 20px;padding:16px 18px 16px 22px;border-radius:22px;background:var(--s1);border:1px solid var(--line);box-shadow:var(--shadow)}
.tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sev,var(--line2))}
.tr .tb{font:800 32px/1 var(--disp);letter-spacing:-.05em;white-space:nowrap;color:var(--sevc,var(--fg))}
.tr .tt{font-weight:600;font-size:14.5px;line-height:1.45;color:var(--fg2)}
.tr .tt b{color:var(--fg)}
.tr.s3{--sev:var(--bad);--sevc:var(--bad)}
.tr.s2{--sev:var(--acc)}
.tr.s1{--sev:var(--mut2)}
@media (max-width:640px){ .tr{grid-template-columns:minmax(0,1fr);gap:6px} .tr .tb{font-size:28px} }
.board.raw::after{background:var(--bad);opacity:.18}
.board.raw .k{color:var(--bad);opacity:1}
.board .tprog{gap:12px;align-items:center;flex-wrap:nowrap}
.board .tcount{font:700 12px/1 var(--body);letter-spacing:.08em;opacity:.7;flex:none}
.board .ttrack{flex:1;height:3px;border-radius:3px;background:color-mix(in srgb,var(--bg) 16%,transparent);overflow:hidden}
.board .ttrack i{display:block;height:100%;border-radius:3px;background:var(--bad);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.board.raw .ph{font:800 clamp(28px,4vw,50px)/1.05 var(--disp);font-style:normal;letter-spacing:-.045em}
.raw-strip{display:flex;align-items:center;gap:16px}
.raw-strip .tb{font:800 28px/1 var(--disp);letter-spacing:-.05em;color:var(--sevc,var(--fg));white-space:nowrap}
.raw-strip.s3{--sevc:var(--bad)}
.raw-strip .tt{font-weight:600;line-height:1.45}

/* ---------- dettes ---------- */
.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.mon{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mon b{font:800 20px/1 var(--disp);letter-spacing:-.03em}
.ech{display:flex;flex-wrap:wrap;gap:5px;grid-column:1 / -1}
.ech span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.ech span.paid{background:var(--ok-s);border-color:transparent;color:var(--ok)}
.ech span.next{background:var(--acc-s);border-color:transparent;color:var(--acc-ink)}

/* ---------- divers ---------- */
#toast{position:fixed;z-index:220;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;padding:12px 18px;border-radius:999px;transition:opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);text-align:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:899px){ #toast{bottom:calc(92px + env(safe-area-inset-bottom))} }
.spark{position:fixed;z-index:210;width:7px;height:7px;border-radius:2px;pointer-events:none;background:var(--acc);animation:fly .95s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.hourpulse{display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px}
.hourpulse .btn{margin-left:auto;background:var(--acc);color:var(--on-acc);border:0;height:32px}
.hourpulse i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.2s infinite;flex:none}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--mut);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
.foot{font-size:11.5px;color:var(--mut);text-align:center;padding:10px 0 0}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

/* =========================================================
   v3 · peau blanc + fluo (noir + néon en sombre)
   ========================================================= */
body{font:450 14.5px/1.55 var(--body);font-variation-settings:"wdth" 125;letter-spacing:-.003em}
body::before{background:radial-gradient(40vmax 30vmax at 90% -6%, var(--glow), transparent 70%)}
::selection{background:var(--acc);color:var(--on-acc)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.k{font:600 10.5px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
.k.acc{color:var(--acc-ink)}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* titres : Archivo étendu, le mot clé surligné au fluo */
.vh{align-items:flex-end}
.ttl{font:900 clamp(30px,4.2vw,48px)/.98 var(--disp)!important;letter-spacing:-.025em!important;text-wrap:balance}
.ttl em,.mark{font:inherit;font-style:normal!important;background:var(--acc)!important;background-image:none!important;color:var(--on-acc)!important;padding:0 .14em;border-radius:.16em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.enter .ttl em{animation:hlIn .9s cubic-bezier(.2,.8,.2,1) both .15s}
@keyframes hlIn{from{background-color:transparent;color:inherit;clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.h{font:700 17px/1.2 var(--body)!important;letter-spacing:-.01em}
.h.sm{font-size:15.5px!important}
.big{font:900 46px/1 var(--disp)!important;letter-spacing:-.03em}
.stat .v{font-family:var(--disp)!important;font-weight:850!important;letter-spacing:-.02em}
.logo{font:900 26px/1 var(--disp)!important;letter-spacing:-.03em}
.logo i{color:var(--acc-ink)}
.oz{display:inline-flex;align-items:center;gap:8px}
.oz i{font:900 15px/1 var(--disp)!important;font-style:normal!important;background:var(--fg)!important;color:var(--bg)!important;padding:6px 7px;border-radius:9px;letter-spacing:-.02em}
.oz b{font:700 10.5px/1 var(--mono)!important;letter-spacing:.24em}
.now .left,.goal .n,.pil .n,.board .ph{font-style:normal!important;font-family:var(--disp)!important}

/* surfaces : cartes plates, aérées */
.card{background:var(--s1);border:1px solid transparent;border-radius:24px;box-shadow:none;padding:22px 24px;gap:14px}
:root[data-theme="dark"] .card{border-color:var(--line)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card{border-color:var(--line)} }
.card.inset{background:var(--s2)}
#view{gap:20px}
.page{gap:20px}
.g2,.g3,.g4{gap:20px}

/* boutons */
.btn{border-radius:999px;font-weight:650;letter-spacing:-.005em;transition:transform .15s, background .2s, box-shadow .2s, color .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--fg)!important;color:var(--bg)!important;border-color:var(--fg)!important}
.btn.acc{background:var(--acc)!important;color:var(--on-acc)!important;border-color:var(--acc)!important}
.btn.acc:hover{box-shadow:0 0 0 4px var(--acc-s), 0 10px 26px -10px var(--acc-l)}
.btn.ghost{background:transparent}
.ib{border-radius:999px}
.pill{border-radius:999px;font-weight:650}
.pill.acc{background:var(--acc);color:var(--on-acc)}
.chip{border-radius:999px}
.in{border-radius:14px;background:var(--bg);border-color:var(--line2)}
.card .in{background:var(--bg)}
.seg{background:var(--s1);border-radius:999px;padding:4px;gap:2px}
.seg button{border-radius:999px;font-weight:650}
.seg button[aria-pressed="true"]{background:var(--ink)!important;color:var(--ink-fg)!important;box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
.bar{border-radius:99px}

/* navigation groupée */
.rail{background:var(--bg);gap:16px}
.nav{gap:1px}
.nav .ngrp{font:600 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);padding:14px 14px 6px}
.nav .ngrp:first-of-type{padding-top:4px}
.nav button{height:36px;font-size:13.5px;font-weight:600;gap:11px}
.nav button svg{width:17px;height:17px}
.nav .hl{height:36px;background:var(--ink);border:0;box-shadow:0 10px 24px -14px rgba(0,0,0,.55)}
.nav .hl::before{display:none}
.nav button[aria-current="page"]{color:var(--ink-fg);padding-left:14px}
.nav .badge{background:var(--acc);color:var(--on-acc)}
.tabbar{background:color-mix(in srgb,var(--bg) 86%,transparent)!important;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tabbar .tind{background:var(--ink)!important}
.tabbar button[aria-current="page"]{color:var(--ink-fg)!important}

/* bloc niveau dans le rail */
.lvl{display:grid;grid-template-columns:auto 1fr;gap:4px 11px;align-items:center;margin-top:12px;padding:11px 12px;border-radius:18px;background:var(--s1);text-align:left;width:100%;transition:transform .2s}
.lvl:hover{transform:translateY(-1px)}
.lvl .ln{grid-row:span 2;width:40px;height:40px;border-radius:13px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font:900 17px/1 var(--disp);position:relative}
.lvl .lr{font:700 13px/1.15 var(--body)}
.lvl .lx{font:500 10.5px/1 var(--mono);color:var(--mut)}
.lvl .xpbar{grid-column:1 / -1;margin-top:4px}
.lvl .stk{grid-column:1 / -1;display:flex;justify-content:space-between;font:600 11px/1 var(--mono);color:var(--mut);margin-top:2px}

.xpbar{height:7px;border-radius:7px;background:var(--s3);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--neon));transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.75) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.8s ease-in-out infinite 1s}
@keyframes shine{to{transform:translateX(100%)}}
.mxp{display:flex;align-items:center;gap:8px}
.mxp .ln{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--ink-fg);display:grid;place-items:center;font:900 13px/1 var(--disp)}

/* barre de chargement */
.loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;pointer-events:none}
.loadbar i{display:block;width:40%;height:100%;background:var(--acc);animation:lb 1.1s ease-in-out infinite}
@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--s3),var(--s1),var(--s3));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* notifications */
#ntfs{position:fixed;top:max(16px, env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));z-index:85;display:flex;flex-direction:column;gap:10px;width:min(370px, calc(100vw - 32px));pointer-events:none}
.ntf{pointer-events:auto;position:relative;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px 14px 15px;border-radius:20px;background:#0B0C0A;color:#F4F7EC;box-shadow:0 22px 50px -18px rgba(0,0,0,.55);animation:ntfIn .55s cubic-bezier(.2,.9,.25,1.25) both;overflow:hidden;cursor:pointer}
:root[data-theme="dark"] .ntf{background:#161915;border:1px solid #2C3229}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ntf{background:#161915;border:1px solid #2C3229} }
.ntf.out{animation:ntfOut .35s ease-in forwards}
.ntf .ni{width:42px;height:42px;border-radius:13px;background:#D4FF3A;color:#0B0C0A;display:grid;place-items:center;font-size:21px;line-height:1}
.ntf.gold .ni{background:#FFE14D}
.ntf.bad .ni{background:#FF4D6D;color:#fff}
.ntf .nt{font:700 13.5px/1.25 var(--body)}
.ntf .nb{font:450 12.5px/1.35 var(--body);color:#B9C1AE;margin-top:2px}
.ntf .nx{font:800 12px/1 var(--mono);color:#D4FF3A;white-space:nowrap}
.ntf::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:#D4FF3A;opacity:.6;transform-origin:left;animation:ntfT var(--t,5.5s) linear forwards}
@keyframes ntfIn{from{opacity:0;transform:translateX(30px) scale(.94)}}
@keyframes ntfOut{to{opacity:0;transform:translateX(40px) scale(.96)}}
@keyframes ntfT{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:899px){ #ntfs{left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));width:auto} }
.bell{position:relative}
.bell .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg)}
.ncenter{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.nrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--s1)}
.nrow .ni{width:34px;height:34px;border-radius:11px;background:var(--acc);display:grid;place-items:center;font-size:17px}
.nrow .nt{font-weight:650;font-size:13px}
.nrow .nb{font-size:12px;color:var(--mut)}
.nrow .nh{font:500 11px var(--mono);color:var(--mut2)}

/* +XP qui s'envole */
.xpf{position:fixed;z-index:95;pointer-events:none;font:900 19px/1 var(--disp);color:#0B0C0A;background:#D4FF3A;padding:6px 10px;border-radius:99px;box-shadow:0 10px 24px -8px rgba(160,210,0,.7);animation:xpUp 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.08)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}

/* niveau supérieur */
.lvup{position:fixed;inset:0;z-index:96;display:grid;place-items:center;background:rgba(5,6,5,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadeIn .3s ease both;padding:24px}
.lvup .box{position:relative;text-align:center;color:#F4F7EC;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px}
.lvup .rays{position:absolute;left:50%;top:38%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:repeating-conic-gradient(from 0deg, rgba(212,255,58,.16) 0deg 8deg, transparent 8deg 22deg);animation:spin 18s linear infinite;mask-image:radial-gradient(circle, #000 25%, transparent 68%);-webkit-mask-image:radial-gradient(circle, #000 25%, transparent 68%);pointer-events:none}
.lvup .big2{position:relative;font:900 132px/0.9 var(--disp);color:#D4FF3A;text-shadow:0 0 40px rgba(212,255,58,.55);animation:pop .9s cubic-bezier(.2,1.4,.3,1) both .1s}
.lvup .k{color:#D4FF3A}
.lvup .t1{position:relative;font:900 28px/1.05 var(--disp)}
.lvup .t2{position:relative;color:#B9C1AE}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}}
@keyframes fadeIn{from{opacity:0}}

/* héros du QG */
.qhero{position:relative;overflow:hidden;border-radius:28px;padding:24px 26px 20px;background:#0B0C0A;color:#F4F7EC;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 26px;align-items:end}
:root[data-theme="dark"] .qhero{background:#0F120E;border:1px solid #2C3229}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qhero{background:#0F120E;border:1px solid #2C3229} }
.qhero::after{content:"";position:absolute;right:-120px;top:-140px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle, rgba(212,255,58,.32), transparent 65%);pointer-events:none}
.qhero .k{color:#9AA391}
.qhero .kk{color:#D4FF3A}
.qhero .jb{font:900 clamp(64px,8.6vw,118px)/.86 var(--disp);letter-spacing:-.04em;color:#F4F7EC;margin-top:10px}
.qhero .jb span{color:#D4FF3A}
.qhero .js{color:#B9C1AE;margin-top:8px;font-size:13.5px}

.qk{display:flex;flex-direction:column;gap:7px;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);text-align:left;color:inherit;transition:transform .2s, background .2s}

.qk .tr2{height:5px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.qk .tr2 i{display:block;height:100%;background:#D4FF3A;border-radius:inherit;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.qk.done .tr2 i{background:#2BFF8E}
.qxp{grid-column:1 / -1;position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.qxp .ln{width:46px;height:46px;border-radius:15px;background:#D4FF3A;color:#0B0C0A;display:grid;place-items:center;font:900 19px/1 var(--disp)}
.qxp .lr{font:700 14px/1.2 var(--body)}
.qxp .lx{font:500 11px/1 var(--mono);color:#9AA391;margin-top:4px}
.qxp .xpbar{background:rgba(255,255,255,.1);margin-top:7px}
.qxp .stk2{display:flex;gap:8px;align-items:center}
.flame{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:rgba(255,225,77,.12);color:#FFE14D;font:800 13px/1 var(--mono)}
.flame .fi{display:inline-block;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.15) rotate(-6deg)}}
@media (max-width:899px){
  .qhero{grid-template-columns:1fr;padding:20px 18px 16px;border-radius:24px}
  .qkpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .qk{padding:10px 11px}
  .qk .v{font-size:19px}
  .qxp{grid-template-columns:auto minmax(0,1fr)}
  .qxp .stk2{grid-column:1 / -1}
}
.qseg{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:20px;min-width:0}

/* quêtes */
.quests{display:flex;flex-direction:column;gap:8px}
.qst{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-radius:18px;background:var(--bg);border:1px solid var(--line);transition:transform .2s, border-color .2s}
.qst .qi{width:38px;height:38px;border-radius:12px;background:var(--s3);display:grid;place-items:center;font-size:18px}

.qbonus b{font:800 12px var(--mono);color:var(--acc)}

/* trophées */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);position:relative}

.bdg.on .be{filter:none;opacity:1;background:var(--acc);box-shadow:0 0 0 5px var(--acc-s), 0 0 26px var(--acc-l)}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.rwd.claimed{opacity:.6}

.lvlcard{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}

.ranks{display:flex;gap:6px;flex-wrap:wrap}
.ranks span{font:600 11px var(--mono);padding:6px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}

.xplist{display:flex;flex-direction:column;gap:6px}

.xplist b{font:700 12px var(--mono);color:var(--acc-ink)}

/* tableau de bord */
.kpi2s{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi2{display:flex;flex-direction:column;gap:8px;padding:18px 18px 16px;border-radius:22px;background:var(--s1);position:relative;overflow:hidden}
.kpi2.hero2{background:var(--fg);color:var(--bg)}

.kpi2 .v small{font:600 13px var(--mono);opacity:.6;margin-left:4px}
.kpi2 .d{display:flex;align-items:center;gap:8px;font:600 11.5px var(--mono);color:var(--mut);flex-wrap:wrap}
.st{font:700 10.5px/1 var(--mono);padding:5px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
.st.ok{background:var(--acc);color:var(--on-acc)}
.st.mid{background:var(--gold);color:#0B0C0A}
.st.bad{background:var(--bad);color:#fff}

.up{color:var(--ok)}.down{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}

.tblw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.fun{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center}
.fr .fl2{font-size:13px;font-weight:600}
.fr .fbw{height:30px;border-radius:10px;background:var(--bg);overflow:hidden;position:relative}
.fr .fbw i{display:block;height:100%;border-radius:10px;background:var(--fc,var(--acc));min-width:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.fr .fbw em{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:700 12px var(--mono);font-style:normal;color:var(--fg)}
.fr .fv{font:800 15px var(--mono);text-align:right}
.fconv{margin-left:162px;font:600 11px var(--mono);color:var(--mut);display:flex;align-items:center;gap:6px}

@media (max-width:640px){ .fr{grid-template-columns:96px minmax(0,1fr) 54px;gap:8px} .fconv{margin-left:104px} }
.rev{display:flex;flex-direction:column;gap:0;border-radius:22px;overflow:hidden;background:var(--fg);color:var(--bg)}
.rev .rs{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(127,127,127,.18)}
.rev .rs:last-child{border-bottom:0}
.rev .rs .rl{font-size:13.5px;line-height:1.3}
.rev .rs .rn{font:900 22px/1 var(--disp);color:var(--acc)}
:root[data-theme="dark"] .rev .rs .rn{color:#0B0C0A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .rev .rs .rn{color:#0B0C0A} }
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}

.sl{display:flex;flex-direction:column;gap:6px}

input[type=range]{width:100%;accent-color:var(--fg);height:22px}
.simout{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:22px;background:var(--fg);color:var(--bg)}
.simout .sv{font:900 46px/1 var(--disp);letter-spacing:-.03em;color:var(--acc)}
:root[data-theme="dark"] .simout .sv{color:#0B0C0A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .simout .sv{color:#0B0C0A} }
.simout .sr3{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid rgba(127,127,127,.25);padding-top:9px}

.tips2{display:flex;flex-direction:column;gap:10px}

.tip2 .tt3{font-weight:700;font-size:13.5px}
.tip2 .tb3{font-size:13px;color:var(--mut);margin-top:2px}
.hm{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:3px}

.pipe{display:flex;flex-direction:column;gap:10px}
.pc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}

.rfun{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}

/* dîn */
.din-next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:24px 26px;border-radius:28px;background:linear-gradient(135deg,#0B2A1C,#0B0C0A 70%);color:#F4F7EC;position:relative;overflow:hidden}
.din-next::after{content:"";position:absolute;right:-80px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle, rgba(43,229,132,.35), transparent 65%)}
.din-next .k{color:#7FD9A8}

function layout(blocks){
  let t = startOf(blocks), prev = null; const out = [];
  for (const b of blocks){
    let start = t, gap = 0, clash = null;
    if (b.pin != null){ if (b.pin >= t){ gap = b.pin - t; start = b.pin; } else if (prev){ clash = {title:prev.b.title, end:t, wanted:b.pin}; } }
    const x = {b, start, end:start + b.dur, gap, clash}; out.push(x); prev = x; t = x.end;

}

  const judged = layout(d.blocks).filter(x => x.b.status || past || (isToday && x.end <= n));
  return judged.length ? Math.round(judged.filter(x => x.b.status === "done").length / judged.length * 100) : null;
}

function trendPerWeek(days = 21){
  const w = weights(), from = addDays(logicalToday(), -days), pts = w.filter(x => x[0] >= from);
  if (pts.length < 3) return null;
  const xs = pts.map(p => diffDays(from, p[0])), ys = pts.map(p => p[1]), n = xs.length;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let num2 = 0, den = 0; xs.forEach((x, i) => { num2 += (x - mx) * (ys[i] - my); den += (x - mx) ** 2; });
  return den ? num2 / den * 7 : null;
}

const LS = "oz30:";
function lsLoad(){
  const r = {}, legacy = [];
  try {
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i); if (!k) continue;
      try {
        if (k.startsWith(LS)){ const o = JSON.parse(localStorage.getItem(k)); if (o && typeof o === "object") r[k.slice(LS.length)] = o; }
        else if (k.startsWith("lockin2:")){ const o = JSON.parse(localStorage.getItem(k)); if (o && typeof o === "object") legacy.push({id:k.slice(8), data:o}); }
        else if (k.startsWith("lockin:day:")){ const o = JSON.parse(localStorage.getItem(k)); if (o && o.date) legacy.push({id:"d-" + o.date, data:o}); }
      } catch(e){}
    }
  } catch(e){}
  Object.keys(r).forEach(id => { if (id.startsWith("d-")) norm(r[id]); });
  return {r, legacy};
}
const lsSet = (id, o) => { try { localStorage.setItem(LS + id, JSON.stringify(o)); } catch(e){} };
let COL = null, OLD = null; const timers = {}, chains = {};
function persist(id){
  const o = S.store[id]; if (!o) return;
  o.updatedAt = Date.now(); lsSet(id, o);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => {
    delete timers[id]; if (!COL) return;
    if (!S.cloudReady){ S.pend.add(id); return; } // pas d'envoi tant que les données du cloud ne sont pas arrivées : sinon on écrase une version plus récente

  }, 700);
}

/* câblage commun aux deux bases : barrière anti-écrasement, fusion, resynchro */
function wireCol(){
  try {
    S.cloudReady = false; gate(true);
    let first = true; const t = setTimeout(() => { if (S.sync !== "cloud") setSync("slow"); gate(false); if (S.loading){ S.loading = false; render(); } toast("Connexion lente : tes changements restent sur cet appareil et partiront dès que la synchro revient."); }, 10000);
    const apply = (docs, cached) => {
      if (!cached){ clearTimeout(t); setSync("cloud"); S.cloudReady = true; gate(false); setTimeout(flushPend, 0); S.syncedAt = Date.now(); }
      let changed = false; const seen = new Set();
      docs.forEach(ds => {
        const o = typeof ds.data === "function" ? ds.data() : ds.data; seen.add(ds.id); if (!o || timers[ds.id]) return;
        const cur = S.store[ds.id];
        if (!cur || (o.updatedAt || 0) > (cur.updatedAt || 0)){
          S.store[ds.id] = ds.id.startsWith("d-") ? norm(o) : o;
          if (ds.id.startsWith("d-")) delete S.drafts[ds.id.slice(2)];
          lsSet(ds.id, o); changed = true;
        }
      });
      if (changed) S.gReady = false; // données venues d'ailleurs : on recale l'XP sans fêter ce qui a été fait sur un autre appareil
      if (first && !cached){ first = false; Object.keys(S.store).forEach(k => { if (!seen.has(k)) persist(k); }); migrate(); }
      const wasLoading = S.loading; if (!cached) S.loading = false;
      if ((changed || (wasLoading && !S.loading)) && !isEditing() && !S.coachBusy && !$("overlay").firstChild) render();
    };
    let rsT; document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible" || !COL) return; S.cloudReady = false; gate(true); clearTimeout(rsT); rsT = setTimeout(() => { S.cloudReady = true; gate(false); flushPend(); }, 6000); S.resync(); });
    S.resync = async () => { try { const qs = await COL.get(); apply(qs.docs || [], false); return true; } catch(e){ return false; } };
    if (COL.get) S.resync();
    COL.onSnapshot(snap => apply(snap.docs || [], !!(snap.metadata && snap.metadata.fromCache)), () => { clearTimeout(t); if (S.sync !== "cloud") setSync("local"); S.loading = false; render(); migrate(); });
  } catch(e){ setSync("local"); S.loading = false; render(); migrate(); }
}
let migrating = false;
async function migrate(){
  if (migrating || (S.store.meta && S.store.meta.migrated)) return;
  migrating = true;
  const olds = [...S.legacy];
  if (OLD){ try { const qs = await OLD.get(); qs.docs.forEach(ds => { const o = ds.data(); if (o) olds.push({id:ds.id, data:o}); }); } catch(e){} }
  let n = 0;
  olds.forEach(({id, data}) => {
    if (/^[dw]-\d{4}-\d{2}-\d{2}$/.test(id)){
      const cur = S.store[id];
      if (!cur || (!hasPlan(cur) && hasPlan(data)) || (data.updatedAt || 0) > (cur.updatedAt || 0)){ S.store[id] = id[0] === "d" ? norm(clone(data)) : {mOk:0, ...clone(data)}; persist(id); n++; }
    } else if (id === "settings"){ mergeLegacySettings(data); n++; }
  });
  S.store.meta = {...(S.store.meta || {}), migrated:Date.now(), from:olds.length}; persist("meta");
  migrating = false;

}
